'use strict';
let GW=900,GH=600;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let scale=1;
function resize(){
  const dpr=window.devicePixelRatio||1;
  const sw=window.innerWidth,sh=window.innerHeight;
  scale=sh/600;
  GW=Math.round(sw/scale);GH=600;
  canvas.style.width=sw+'px';canvas.style.height=sh+'px';
  canvas.width=Math.round(sw*dpr);canvas.height=Math.round(sh*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
resize();
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){_mStop();_prevGS='';}});
window.addEventListener('pagehide',()=>{_mStop();_prevGS='';})

const rnd=(a,b)=>Math.random()*(b-a)+a;
const rndInt=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgba=(r,g,b,a)=>`rgba(${r},${g},${b},${a})`;
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function range(a,b,s=1){const r=[];for(let i=a;i<b;i+=s)r.push(i);return r;}

// ── Audio ──────────────────────────────────────────────────────────────────────
// ── Firebase Realtime Database ─────────────────────────────────────────────────
const FB_URL='YOUR_FIREBASE_URL_HERE'; // replace with your Firebase DB URL
const _fbOK=FB_URL!=='YOUR_FIREBASE_URL_HERE';
let globalPlays=0,globalKills=0,globalOverlords=0,globalLeaderboard=[];
let globalStatsLoaded=false,_globalFetching=false;
let sessionKills=0; // kills this game session, flushed to FB on game end

async function _fbReq(path,opts){
  if(!_fbOK)return null;
  try{const r=await fetch(FB_URL+'/'+path+'.json',opts);return await r.json();}catch(e){return null;}
}
async function _fbGet(p){return _fbReq(p);}
async function _fbPut(p,v){return _fbReq(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});}
async function _fbPost(p,v){return _fbReq(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});}
async function _fbInc(p){const c=await _fbGet(p)||0;await _fbPut(p,c+1);}
async function _fbIncBy(p,n){if(n<=0)return;const c=await _fbGet(p)||0;await _fbPut(p,c+n);}

async function fetchGlobalData(){
  if(_globalFetching)return;_globalFetching=true;
  if(!_fbOK){globalStatsLoaded=true;_globalFetching=false;return;}
  try{
    const[st,lb]=await Promise.all([_fbGet('stats'),_fbGet('leaderboard')]);
    if(st){globalPlays=st.plays||0;globalKills=st.kills||0;globalOverlords=st.overlords||0;}
    if(lb&&typeof lb==='object'){
      globalLeaderboard=Object.values(lb)
        .filter(e=>e&&e.name&&e.score!=null)
        .sort((a,b)=>b.score-a.score).slice(0,10);
    }
  }catch(e){}
  globalStatsLoaded=true;_globalFetching=false;
}
async function postGlobalEntry(name,sc,date){
  if(!_fbOK)return;
  _fbPost('leaderboard',{name,score:sc,date});
  _fbInc('stats/overlords');
}
function globalIncrementPlays(){if(_fbOK)_fbInc('stats/plays');}
function globalFlushKills(){if(_fbOK&&sessionKills>0){_fbIncBy('stats/kills',sessionKills);sessionKills=0;}}

let actx=null,masterGain=null,sfxGain=null;
let masterVolume=parseFloat(localStorage.getItem('ss_vol')||'0.7');
let sfxVolume=parseFloat(localStorage.getItem('ss_sfx')||'0.7');
function saveMasterVolume(){try{localStorage.setItem('ss_vol',masterVolume.toFixed(2));}catch(e){}}
function saveSfxVolume(){try{localStorage.setItem('ss_sfx',sfxVolume.toFixed(2));}catch(e){}}
let particlesEnabled=localStorage.getItem('ss_particles')!=='0';
let vibrateEnabled=localStorage.getItem('ss_vibrate')!=='0';
let accentIdx=parseInt(localStorage.getItem('ss_accent')||'0');
const ACCENTS=['#00c8ff','#00e080','#ff8c00','#cc44ff'];
let AC=ACCENTS[accentIdx]||ACCENTS[0];
function saveGameSettings(){try{localStorage.setItem('ss_particles',particlesEnabled?'1':'0');localStorage.setItem('ss_vibrate',vibrateEnabled?'1':'0');localStorage.setItem('ss_accent',String(accentIdx));}catch(e){}}
function setAccent(i){accentIdx=Math.max(0,Math.min(3,i));AC=ACCENTS[accentIdx];saveGameSettings();}
function vibrate(ms){if(vibrateEnabled&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}
function initAudio(){
  if(actx)return;
  try{
    actx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=actx.createGain();masterGain.gain.value=masterVolume;
    masterGain.connect(actx.destination);
    sfxGain=actx.createGain();sfxGain.gain.value=sfxVolume;
    sfxGain.connect(actx.destination);
  }catch(e){}
}
function playTone(freq,dur,type,vol){
  if(!actx)return;type=type||'sine';vol=vol||0.15;
  try{
    const g=actx.createGain(),o=actx.createOscillator();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g);g.connect(sfxGain||masterGain||actx.destination);o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
function playNoise(dur,vol){
  if(!actx)return;vol=vol||0.25;
  try{
    const buf=actx.createBuffer(1,Math.ceil(actx.sampleRate*dur),actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-8*i/d.length);
    const src=actx.createBufferSource(),g=actx.createGain();
    g.gain.value=vol;src.buffer=buf;src.connect(g);g.connect(sfxGain||masterGain||actx.destination);src.start();
  }catch(e){}
}
const SND={
  shoot:()=>playTone(820,0.07,'sine',0.12),
  boom:()=>playNoise(0.3,0.4),
  hit:()=>playTone(200,0.15,'sawtooth',0.2),
  powerup:()=>{playTone(440,0.15,'sine',0.2);setTimeout(()=>playTone(660,0.2,'sine',0.2),100);},
  uiClick:()=>playTone(600,0.05,'sine',0.1),
  bossWarn:()=>playTone(110,0.5,'sawtooth',0.3),
  bossEnrage:()=>{playTone(300,0.3,'sawtooth',0.25);playTone(60,0.4,'sine',0.2);},
  bossDie:()=>playNoise(0.6,0.5),
  levelComplete:()=>{[261,329,392].forEach((f,i)=>setTimeout(()=>playTone(f,0.25,'sine',0.3),i*120));},
  victory:()=>{[261,329,392,523].forEach((f,i)=>setTimeout(()=>playTone(f,0.4,'sine',0.35),i*150));},
};

// ── Music Engine ─────────────────────────────────────────────────────────────
// States: 'off' 'menu' 'game' 'tense' 'epic' 'final'
let _mState='off',_mTimer=null,_mNodes=[];
function _mStop(){
  if(_mTimer){clearTimeout(_mTimer);_mTimer=null;}
  const t=actx?actx.currentTime+0.06:0;
  for(const n of _mNodes){try{n.stop(t);n.disconnect();}catch(e){}}
  _mNodes=[];_mState='off';
}
function _mAddN(n){_mNodes.push(n);return n;}
function _mOsc(freq,t0,dur,type,vol,det){
  if(!actx||!masterGain)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.value=freq;if(det)o.detune.value=det;
  const atk=Math.min(0.04,dur*0.12);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+atk);
  g.gain.setValueAtTime(vol,t0+dur*0.65);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(masterGain);o.start(t0);o.stop(t0+dur+0.08);_mAddN(o);
}
function _mPad(freqs,t0,dur,vol){
  for(const f of freqs){_mOsc(f,t0,dur,'sine',vol*0.45,0);_mOsc(f,t0,dur,'sine',vol*0.28,+10);_mOsc(f,t0,dur,'sine',vol*0.18,-10);}
}
function _mKick(t0,vol){
  if(!actx||!masterGain)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(160,t0);o.frequency.exponentialRampToValueAtTime(40,t0+0.12);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.22);
  o.connect(g);g.connect(masterGain);o.start(t0);o.stop(t0+0.26);_mAddN(o);
}
function _mHat(t0,vol){
  if(!actx||!masterGain)return;
  const n=Math.ceil(actx.sampleRate*0.045);
  const buf=actx.createBuffer(1,n,actx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=actx.createBufferSource(),flt=actx.createBiquadFilter(),g=actx.createGain();
  flt.type='highpass';flt.frequency.value=7500;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.045);
  src.buffer=buf;src.connect(flt);flt.connect(g);g.connect(masterGain);src.start(t0);_mAddN(src);
}
function _mSnare(t0,vol){
  if(!actx||!masterGain)return;
  const n=Math.ceil(actx.sampleRate*0.09);
  const buf=actx.createBuffer(1,n,actx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=actx.createBufferSource(),flt=actx.createBiquadFilter(),g=actx.createGain();
  flt.type='bandpass';flt.frequency.value=2200;flt.Q.value=0.7;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.09);
  src.buffer=buf;src.connect(flt);flt.connect(g);g.connect(masterGain);src.start(t0);_mAddN(src);
}
function _mBass(freq,t0,dur,vol,cutoff){
  if(!actx||!masterGain)return;
  const o=actx.createOscillator(),flt=actx.createBiquadFilter(),g=actx.createGain();
  o.type='sawtooth';o.frequency.value=freq;
  flt.type='lowpass';flt.frequency.value=cutoff||380;flt.Q.value=2.5;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur*0.85);
  o.connect(flt);flt.connect(g);g.connect(masterGain);o.start(t0);o.stop(t0+dur);_mAddN(o);
}

// ── Menu: ambient D minor, 72 BPM ──────────────────────────────────────────────
const _MBPM=72,_MBT=60/_MBPM;
const _MCH=[[146.83,174.61,220],[116.54,146.83,174.61],[174.61,220,261.63],[110,138.59,164.81]];
const _MARP=[220,261.63,329.63,261.63,174.61,220,261.63,220,261.63,329.63,392,329.63,220,261.63,329.63,261.63];
const _MBAS=[73.42,58.27,87.31,55];
function _menuLoop(t0){
  if(_mState!=='menu')return;const loop=16*_MBT;
  for(let c=0;c<4;c++){const ct=t0+c*4*_MBT;_mPad(_MCH[c],ct,4*_MBT*0.92,0.065);_mOsc(_MBAS[c],ct,4*_MBT*0.75,'sine',0.09,0);
    for(let b=0;b<4;b++){const at=ct+b*_MBT;_mOsc(_MARP[c*4+b],at,_MBT*0.42,'triangle',0.032,0);if(b%2===1)_mOsc(_MARP[c*4+b]*2,at+_MBT*0.5,_MBT*0.35,'triangle',0.016,0);}
  }
  _mTimer=setTimeout(()=>{if(_mState==='menu')_menuLoop(t0+loop);},(loop-0.6)*1000);
}
function startMenuMusic(){if(!actx||_mState==='menu')return;_mStop();_mState='menu';_menuLoop(actx.currentTime+0.12);}

// ── Ambient primitives ─────────────────────────────────────────────────────────
function _mOscAmb(freq,t0,dur,type,vol,det){
  if(!actx||!masterGain)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.value=freq;if(det)o.detune.value=det;
  const atk=Math.min(1.4,dur*0.18),rel=Math.min(1.6,dur*0.22);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+atk);
  g.gain.setValueAtTime(vol,t0+dur-rel);g.gain.linearRampToValueAtTime(0,t0+dur);
  o.connect(g);g.connect(masterGain);o.start(t0);o.stop(t0+dur+0.1);_mAddN(o);
}
function _ambPad(freqs,t0,dur,vol){
  for(const f of freqs){
    _mOscAmb(f,t0,dur,'sine',vol*0.45,0);
    _mOscAmb(f,t0,dur,'sine',vol*0.28,+9);
    _mOscAmb(f,t0,dur,'sine',vol*0.18,-9);
    _mOscAmb(f*2,t0,dur,'sine',vol*0.12,+4);
  }
}
function _ambBass(freq,t0,dur,vol){
  if(!actx||!masterGain)return;
  const o=actx.createOscillator(),flt=actx.createBiquadFilter(),g=actx.createGain();
  o.type='sine';o.frequency.value=freq;
  flt.type='lowpass';flt.frequency.value=220;
  const atk=Math.min(1.2,dur*0.18),rel=Math.min(1.4,dur*0.22);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+atk);
  g.gain.setValueAtTime(vol,t0+dur-rel);g.gain.linearRampToValueAtTime(0,t0+dur);
  o.connect(flt);flt.connect(g);g.connect(masterGain);o.start(t0);o.stop(t0+dur+0.1);_mAddN(o);
}
function _ambNote(freq,t0,dur,vol){
  _mOscAmb(freq,t0,dur,'sine',vol,0);_mOscAmb(freq,t0,dur,'sine',vol*0.55,+6);
}
function _ambPulse(freq,t0,dur,vol){
  if(!actx||!masterGain)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(freq*1.5,t0);o.frequency.exponentialRampToValueAtTime(freq,t0+0.18);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(masterGain);o.start(t0);o.stop(t0+dur+0.05);_mAddN(o);
}

// ── Game: cosmic float, E minor, no percussion ─────────────────────────────────
const _G1CH=[[164.81,196,246.94],[130.81,164.81,196],[98,123.47,146.83],[110,164.81,220]];
const _G1MEL=[329.63,0,392,0,440,0,392,329.63,293.66,0,329.63,0,261.63,0,293.66,0];
function _gameLoop(t0){
  if(_mState!=='game')return;const loop=32;
  for(let c=0;c<4;c++){const ct=t0+c*8;_ambPad(_G1CH[c],ct,8,0.055);_ambBass(_G1CH[c][0]/2,ct,8,0.07);}
  for(let i=0;i<16;i++){if(_G1MEL[i])_ambNote(_G1MEL[i],t0+i*2,1.6,0.028);}
  _mTimer=setTimeout(()=>{if(_mState==='game')_gameLoop(t0+loop);},(loop-1.5)*1000);
}
function startGameMusic(){if(!actx||_mState==='game')return;_mStop();_mState='game';_gameLoop(actx.currentTime+0.12);}

// ── Tense: Marauder, dark pads + bass pulses ───────────────────────────────────
const _T2CH=[[164.81,196,293.66],[146.83,174.61,220],[110,130.81,164.81],[123.47,164.81,220]];
function _tenseLoop(t0){
  if(_mState!=='tense')return;const loop=24;
  for(let c=0;c<4;c++){const ct=t0+c*6;_ambPad(_T2CH[c],ct,6,0.06);_ambBass(_T2CH[c][0]/2,ct,6,0.08);
    for(let p=0;p<3;p++)_ambPulse(_T2CH[c][0]/2,ct+p*2,1.4,0.09);}
  _mTimer=setTimeout(()=>{if(_mState==='tense')_tenseLoop(t0+loop);},(loop-1.5)*1000);
}
function startTenseMusic(){if(!actx||_mState==='tense')return;_mStop();_mState='tense';_tenseLoop(actx.currentTime+0.12);}

// ── Epic: Dreadnought, dissonant clusters ──────────────────────────────────────
const _E2CH=[[164.81,185.00,246.94],[130.81,138.59,207.65],[98,103.83,164.81],[110,155.56,233.08]];
function _epicLoop(t0){
  if(_mState!=='epic')return;const loop=20;
  for(let c=0;c<4;c++){const ct=t0+c*5;_ambPad(_E2CH[c],ct,5,0.065);_ambBass(_E2CH[c][0]/2,ct,5,0.09);
    for(let p=0;p<3;p++)_ambPulse(_E2CH[c][0]/2,ct+p*1.5,1.2,0.12);}
  _mTimer=setTimeout(()=>{if(_mState==='epic')_epicLoop(t0+loop);},(loop-1.5)*1000);
}
function startEpicMusic(){if(!actx||_mState==='epic')return;_mStop();_mState='epic';_epicLoop(actx.currentTime+0.12);}

// ── Final: Crimson Overlord, maximum dissonance ────────────────────────────────
const _F2CH=[[164.81,174.61,233.08,311.13],[138.59,146.83,207.65,277.18],[103.83,116.54,174.61,233.08],[110,123.47,185.00,246.94]];
function _finalLoop(t0){
  if(_mState!=='final')return;const loop=16;
  for(let c=0;c<4;c++){const ct=t0+c*4;
    _ambPad(_F2CH[c],ct,4,0.07);
    _ambPad(_F2CH[c].map(f=>f*1.007),ct,4,0.04);
    _ambBass(_F2CH[c][0]/2,ct,4,0.10);
    _mOscAmb(_F2CH[c][0]*8,ct,3.5,'sine',0.018,0);
    for(let p=0;p<5;p++)_ambPulse(_F2CH[c][0]/2,ct+p*0.75,0.9,0.15);}
  _mTimer=setTimeout(()=>{if(_mState==='final')_finalLoop(t0+loop);},(loop-1.5)*1000);
}
function startFinalMusic(){if(!actx||_mState==='final')return;_mStop();_mState='final';_finalLoop(actx.currentTime+0.12);}

function stopMusic(){_mStop();}
let _prevGS='';
function _updateMusic(){
  if(!actx)return;
  let want='off';
  if(['menu','level_select','settings','intro','stats'].includes(gameState))want='menu';
  else if(gameState==='playing'){
    const hasFinal=bosses&&bosses.some(b=>b instanceof FinalBoss&&!b.dead);
    const hasDread=!hasFinal&&bosses&&bosses.some(b=>b instanceof Dreadnought&&!b.dead);
    const hasMini=!hasFinal&&!hasDread&&bosses&&bosses.some(b=>b instanceof MiniBoss&&!b.dead);
    if(hasFinal)want='final';
    else if(hasDread)want='epic';
    else if(hasMini)want='tense';
    else want='game';
  }
  // paused / game_over / victory → want='off' → silence
  if(want===_prevGS)return;_prevGS=want;
  if(want==='menu')startMenuMusic();
  else if(want==='game')startGameMusic();
  else if(want==='tense')startTenseMusic();
  else if(want==='epic')startEpicMusic();
  else if(want==='final')startFinalMusic();
  else stopMusic();
}

// ── Stars (parallax layers) ────────────────────────────────────────────────────
class Star{
  constructor(layer){this.layer=layer||0;this.reset(true);}
  reset(anywhere){
    this.x=anywhere?rnd(0,GW):GW+4;
    this.y=rnd(0,GH);
    if(this.layer===0){this.speed=rnd(0.25,0.7);this.r=0.6;this.bright=rndInt(35,80);}
    else if(this.layer===1){this.speed=rnd(1.1,2.4);this.r=rnd(0.8,1.4);this.bright=rndInt(90,170);}
    else{this.speed=rnd(3,6);this.r=rnd(1.5,2.8);this.bright=rndInt(180,255);}
    const t=Math.random();
    this.tint=t<0.12?'b':t<0.2?'y':'w';
  }
  update(){this.x-=this.speed;if(this.x<0)this.reset(false);}
  draw(){
    const b=this.bright;
    const r=this.tint==='b'?Math.max(40,b-40):b;
    const bl=this.tint==='b'?Math.min(255,b+30):this.tint==='y'?Math.max(40,b-60):b;
    ctx.fillStyle=`rgb(${r},${b},${bl})`;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
  }
}

// ── Background decoration rocks (non-interactive, purely visual) ──────────────
let bgRocks=[];
class BgRock{
  constructor(anywhere){
    this.r=rnd(2,7);
    this.x=anywhere?rnd(0,GW):GW+this.r+4;
    this.y=rnd(0,GH);
    this.spd=rnd(0.04,0.22);
    this.rotSpd=rnd(-0.007,0.007);
    this.angle=rnd(0,Math.PI*2);
    this.alpha=rnd(0.07,0.26);
    const N=rndInt(5,8);this.v=[];
    for(let i=0;i<N;i++){const a=i/N*Math.PI*2+rnd(-0.2,0.2);this.v.push({a,r:this.r*rnd(0.68,1.32)});}
  }
  update(){
    this.x-=this.spd;this.angle+=this.rotSpd;
    if(this.x<-this.r-4){this.r=rnd(2,7);this.x=GW+this.r+4;this.y=rnd(0,GH);this.alpha=rnd(0.07,0.26);}
  }
  draw(){
    ctx.save();ctx.globalAlpha=this.alpha;ctx.translate(Math.round(this.x),Math.round(this.y));ctx.rotate(this.angle);
    ctx.fillStyle='#998877';
    ctx.beginPath();
    for(let i=0;i<this.v.length;i++){const vv=this.v[i];const px=Math.cos(vv.a)*vv.r,py=Math.sin(vv.a)*vv.r;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.restore();
  }
}

// ── Player bullet (horizontal rect, goes right) ────────────────────────────────
class Bullet{
  constructor(x,y){this.x=x;this.y=y;this.dead=false;}
  update(){this.x+=14;if(this.x>GW+20)this.dead=true;}
  draw(){
    ctx.shadowColor='#ffdc00';ctx.shadowBlur=10;
    ctx.fillStyle='#ffdc00';ctx.fillRect(this.x,this.y-2,18,5);
    ctx.shadowBlur=4;ctx.fillStyle='#fff';ctx.fillRect(this.x+4,this.y-1,10,3);
    ctx.shadowBlur=0;
  }
  get rect(){return{x:this.x,y:this.y-2,w:18,h:5};}
}

class RocketBullet{
  constructor(x,y){
    this.x=x;this.y=y;this.vx=6;this.vy=0;this.dead=false;this.W=24;this.H=8;
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;
    if(this.x>GW+30||this.x<-30)this.dead=true;
  }
  draw(){
    const x=this.x,y=this.y;
    ctx.shadowColor='#ff3300';ctx.shadowBlur=14;
    ctx.fillStyle='#ff5500';ctx.beginPath();ctx.ellipse(x,y,12,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.ellipse(x,y,7,3,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=6;ctx.fillStyle='#ff8800';
    ctx.beginPath();ctx.moveTo(x-12,y-3);ctx.lineTo(x-20,y);ctx.lineTo(x-12,y+3);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
  }
  get rect(){return{x:this.x-12,y:this.y-5,w:this.W,h:this.H};}
}

// ── Enemy bullet (angle-based; 180° = straight left) ──────────────────────────
class EnemyBullet{
  constructor(x,y,angleDeg){
    angleDeg=angleDeg===undefined?180:angleDeg;
    this.x=x;this.y=y;
    const rad=angleDeg*Math.PI/180;
    this.vx=Math.cos(rad)*6;this.vy=Math.sin(rad)*6;
    this.dead=false;
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<-20||this.y<-20||this.y>GH+20)this.dead=true;
  }
  draw(){
    ctx.shadowColor='#ff3030';ctx.shadowBlur=12;
    ctx.fillStyle='#dc3232';ctx.beginPath();ctx.arc(this.x,this.y,5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=5;ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(this.x,this.y,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  get rect(){return{x:this.x-5,y:this.y-5,w:10,h:10};}
}

// ── Explosion ──────────────────────────────────────────────────────────────────
class Explosion{
  constructor(x,y,big){
    this.x=x;this.y=y;this.frame=0;this.total=big?30:24;this.dead=false;
    this.mr=big?56:30;
    const n=big?24:12;this.sparks=[];
    for(let i=0;i<n;i++)this.sparks.push({
      a:rnd(0,Math.PI*2),spd:rnd(big?2.5:1.5,big?6.5:5),
      r:rnd(1.5,big?4:2.8),
      c:Math.random()<0.35?'#fff':Math.random()<0.5?'#ffdc00':'#ff8c00'
    });
  }
  update(){this.frame++;if(this.frame>=this.total)this.dead=true;}
  draw(){
    const t=this.frame/this.total,r=Math.round(this.mr*Math.sin(t*Math.PI));
    if(r<=0)return;
    ctx.shadowColor='#ff8c00';ctx.shadowBlur=r*2;
    ctx.fillStyle=`rgb(255,${Math.round(180*(1-t))},0)`;
    ctx.beginPath();ctx.arc(this.x,this.y,r,0,Math.PI*2);ctx.fill();
    if(r>5){
      ctx.shadowBlur=r;
      ctx.fillStyle=`rgb(255,255,${Math.round(200*(1-t))})`;
      ctx.beginPath();ctx.arc(this.x,this.y,r>>1,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=3;
    const fade=1-t;
    if(particlesEnabled)for(const sp of this.sparks){
      ctx.globalAlpha=fade*0.9;ctx.fillStyle=sp.c;
      ctx.beginPath();ctx.arc(this.x+Math.cos(sp.a)*sp.spd*this.frame,this.y+Math.sin(sp.a)*sp.spd*this.frame,sp.r*(1-t*0.5),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;
  }
}

// ── Asteroid (obstacle – drifts from right, takes 3 hits) ────────────────────
class Asteroid{
  constructor(big){
    this.big=big||false;
    this.r=big?rndInt(28,42):rndInt(14,24);
    this.x=GW+this.r+10;this.y=rnd(55,GH-55);
    this.speed=rnd(big?0.9:1.4,big?2.0:3.2);
    this.vy=rnd(-0.5,0.5);
    this.angle=rnd(0,Math.PI*2);
    this.rotSpeed=rnd(-0.025,0.025);
    this.hp=big?4:2;this.maxHp=this.hp;
    this.score=big?120:60;
    this.dropChance=big?0.4:0.2;
    this.dead=false;this.hitFlash=0;this.bullets=[];
    // Generate irregular polygon vertices
    const N=rndInt(7,11);
    this.verts=[];
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2+rnd(-0.15,0.15);
      this.verts.push({a,r:this.r*rnd(0.72,1.28)});
    }
  }
  update(ts){
    ts=ts||1;
    this.x-=this.speed*ts;this.y+=this.vy*ts;
    this.angle+=this.rotSpeed*ts;
    if(this.y<this.r||this.y>GH-this.r)this.vy*=-1;
    if(this.x<-this.r-20)this.dead=true;
    if(this.hitFlash>0)this.hitFlash--;
  }
  takeHit(){this.hp--;this.hitFlash=7;return this.hp<=0;}
  shouldDrop(){return Math.random()<this.dropChance;}
  draw(){
    const x=Math.round(this.x),y=Math.round(this.y);
    ctx.save();ctx.translate(x,y);ctx.rotate(this.angle);
    if(this.hitFlash>0){ctx.shadowColor='#ffffff';ctx.shadowBlur=22;}
    // Main body
    ctx.beginPath();
    for(let i=0;i<this.verts.length;i++){
      const v=this.verts[i];
      const px=Math.cos(v.a)*v.r,py=Math.sin(v.a)*v.r;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();
    const col=this.hitFlash>0?'#ffffff':this.big?'#a09080':'#887868';
    ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle='#3a2e28';ctx.lineWidth=1.5;ctx.stroke();
    // Surface highlight
    ctx.fillStyle=this.hitFlash>0?'#ffffff':this.big?'#c0b0a0':'#a09080';
    ctx.beginPath();
    for(let i=0;i<this.verts.length;i++){
      const v=this.verts[i];
      const px=Math.cos(v.a)*v.r*0.62,py=Math.sin(v.a)*v.r*0.62;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    // HP bar
    if(this.maxHp>1&&this.hp<this.maxHp){
      const bw=this.r*2.6;
      ctx.fillStyle='#1a1a1a';ctx.fillRect(-bw/2,-this.r-11,bw,5);
      ctx.fillStyle='#ff8c00';ctx.fillRect(-bw/2,-this.r-11,bw*this.hp/this.maxHp,5);
    }
    ctx.restore();
  }
  get rect(){return{x:this.x-this.r*0.8,y:this.y-this.r*0.8,w:this.r*1.6,h:this.r*1.6};}
}

// ── Mine (drifts right-to-left, explodes into 8 bullets when shot) ────────────
class Mine{
  constructor(){
    this.x=GW+18;this.y=rnd(60,GH-60);
    this.speed=rnd(0.5,1.2);this.vy=rnd(-0.25,0.25);
    this.angle=0;this.pulseT=rnd(0,Math.PI*2);
    this.hp=1;this.maxHp=1;this.score=80;
    this.dead=false;this.W=28;this.H=28;
    this.bullets=[];this.dropChance=0;
  }
  update(ts){
    ts=ts||1;
    this.x-=this.speed*ts;this.y+=this.vy*ts;
    this.angle+=0.02*ts;this.pulseT+=0.07*ts;
    if(this.y<30||this.y>GH-30)this.vy*=-1;
    if(this.x<-30)this.dead=true;
  }
  takeHit(){
    this.hp--;
    if(this.hp<=0){for(let i=0;i<8;i++)freeEBullets.push(new EnemyBullet(this.x,this.y,i/8*360));return true;}
    return false;
  }
  shouldDrop(){return false;}
  draw(){
    const x=Math.round(this.x),y=Math.round(this.y);
    const pulse=0.7+0.3*Math.sin(this.pulseT);
    ctx.save();ctx.translate(x,y);
    ctx.shadowColor='#ff4400';ctx.shadowBlur=Math.round(14*pulse);
    ctx.fillStyle='#6a1800';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#cc3300';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();
    ctx.rotate(this.angle);
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2;ctx.save();ctx.rotate(a);
      ctx.fillStyle=`rgb(255,${Math.round(100*pulse)},0)`;
      ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(-3,-18);ctx.lineTo(3,-18);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur=0;
    ctx.fillStyle=`rgb(255,${Math.round(180*pulse)},0)`;
    ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  get rect(){return{x:this.x-14,y:this.y-14,w:28,h:28};}
}

// ── Gunship (slow & armored, 3-burst fire, green engines) ─────────────────────
class Gunship{
  constructor(){
    this.x=GW+65;this.y=rnd(65,GH-65);
    this.speed=rnd(1.0,1.8);this.vy=rnd(-0.4,0.4);
    this.hp=5;this.maxHp=5;this.W=64;this.H=44;
    this.score=400;this.dropChance=0.55;
    this.dead=false;
    this.shootTimer=rndInt(60,100);this.burstLeft=0;this.burstTimer=0;
    this.bullets=[];
  }
  update(ts){
    ts=ts||1;
    this.x-=this.speed*ts;this.y+=this.vy*ts;
    if(this.y<55||this.y>GH-55)this.vy*=-1;
    if(this.x<-this.W-20)this.dead=true;
    if(this.burstLeft>0){
      this.burstTimer-=ts;
      if(this.burstTimer<=0){
        this.bullets.push(new EnemyBullet(this.x-this.W/2,this.y,180));
        this.burstLeft--;this.burstTimer=9;
      }
    }else{
      this.shootTimer-=ts;
      if(this.shootTimer<=0){this.shootTimer=rndInt(80,130);this.burstLeft=3;this.burstTimer=0;}
    }
    this.bullets=this.bullets.filter(b=>{b.update();return !b.dead;});
  }
  takeHit(){this.hp--;return this.hp<=0;}
  shouldDrop(){return Math.random()<this.dropChance;}
  draw(){
    const x=Math.round(this.x),y=Math.round(this.y);
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle='#1a3a1a';ctx.fillRect(-28,-22,46,8);ctx.fillRect(-28,14,46,8);
    ctx.fillStyle='#777';
    ctx.fillRect(-30,-25,9,4);ctx.fillRect(-18,-25,9,4);
    ctx.fillRect(-30,21,9,4);ctx.fillRect(-18,21,9,4);
    ctx.fillStyle='#2a5a2a';
    ctx.beginPath();ctx.moveTo(-32,-14);ctx.lineTo(32,-9);ctx.lineTo(32,9);ctx.lineTo(-32,14);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1e4a1e';
    ctx.beginPath();ctx.moveTo(-12,-11);ctx.lineTo(24,-7);ctx.lineTo(24,7);ctx.lineTo(-12,11);ctx.closePath();ctx.fill();
    const fl=rndInt(8,16);
    ctx.shadowColor='#00ff44';ctx.shadowBlur=15;
    ctx.fillStyle='#00cc44';
    ctx.beginPath();ctx.moveTo(-32,-6);ctx.lineTo(-32-fl,-2);ctx.lineTo(-32,2);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-32,6);ctx.lineTo(-32-fl,2);ctx.lineTo(-32,-2);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    ctx.shadowColor='#88ffaa';ctx.shadowBlur=8;
    ctx.fillStyle='#88ffaa';ctx.beginPath();ctx.arc(18,0,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#335533';ctx.beginPath();ctx.arc(18,0,4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#1a1a1a';ctx.fillRect(-30,-32,60,7);
    ctx.fillStyle='#32c832';ctx.fillRect(-30,-32,Math.max(0,60*this.hp/this.maxHp),7);
    ctx.restore();
    for(const b of this.bullets)b.draw();
  }
  get rect(){return{x:this.x-this.W/2,y:this.y-this.H/2,w:this.W,h:this.H};}
}

// ── Power-up (4 types matching Python, move left) ─────────────────────────────
const PU_CFG={
  double:{color:'#ffdc00',label:'2x'},
  shield:{color:AC,label:'SHD'},
  slow:  {color:'#a01edc',label:'SLW'},
  life:  {color:'#dc5064',label:'+HP'},
  wpn_spread:{color:'#00ff88',label:'SPR'},
  wpn_rapid: {color:'#ff6600',label:'RPD'},
  wpn_rocket:{color:'#ff3333',label:'RKT'},
};
class PowerUp{
  constructor(x,y,kind){
    const kinds=['double','shield','slow','life'];
    this.kind=kind||kinds[rndInt(0,3)];
    const c=PU_CFG[this.kind];
    this.color=c.color;this.label=c.label;
    this.x=x;this.y=y;this.vx=-2.0;this.vy=rnd(-0.8,0.8);
    this.angle=0;this.dead=false;this.R=15;
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;this.angle+=4;
    if(this.y<this.R||this.y>GH-this.R)this.vy*=-1;
    if(this.x<-40)this.dead=true;
  }
  draw(){
    const x=this.x,y=this.y,R=this.R;
    const pulse=4*Math.sin(this.angle*3*Math.PI/180);
    ctx.globalAlpha=0.2;ctx.fillStyle=this.color;
    ctx.beginPath();ctx.arc(x,y,R+pulse+7,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.35;
    ctx.beginPath();ctx.arc(x,y,R+pulse+3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#000';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.label,x,y);ctx.textBaseline='alphabetic';
  }
  get rect(){return{x:this.x-this.R,y:this.y-this.R,w:this.R*2,h:this.R*2};}
}

// ── Player (left half of screen, shoots right) ────────────────────────────────
class Player{
  constructor(){
    this.x=120;this.y=GH/2;this.speed=5;
    this.health=3;this.maxHp=5;
    this.shootCd=0;this.shootDelay=14;
    this.invFrames=0;
    this.doubleTimer=0;this.slowTimer=0;this.hasShield=false;
    this.bullets=[];
    this.weapon='normal';this.weaponTimer=0;
  }
  update(keys){
    if(keys.up)   this.y-=this.speed;
    if(keys.down) this.y+=this.speed;
    if(keys.left) this.x-=this.speed;
    if(keys.right)this.x+=this.speed;
    this.x=clamp(this.x,30,GW/2);
    this.y=clamp(this.y,30,GH-30);
    if(this.shootCd>0)this.shootCd--;
    if(keys.fire&&this.shootCd===0)this._shoot();
    if(this.invFrames>0)this.invFrames--;
    if(this.doubleTimer>0)this.doubleTimer--;
    if(this.weaponTimer>0){this.weaponTimer--;if(!this.weaponTimer)this.weapon='normal';}
    if(this.slowTimer>0)this.slowTimer--;
    this.bullets=this.bullets.filter(b=>{b.update();return !b.dead;});
  }
  _shoot(){
    const bx=this.x+32;
    if(this.weapon==='spread'){
      for(const dy of[-14,0,14])this.bullets.push(new Bullet(bx,this.y+dy));
      this.shootCd=this.shootDelay+6;
    }else if(this.weapon==='rapid'){
      this.bullets.push(new Bullet(bx,this.y+(Math.random()-0.5)*5));
      this.shootCd=7;
    }else if(this.weapon==='rocket'){
      this.bullets.push(new RocketBullet(bx,this.y));
      this.shootCd=this.shootDelay+20;
    }else{
      if(this.doubleTimer>0){
        this.bullets.push(new Bullet(bx,this.y-9));
        this.bullets.push(new Bullet(bx,this.y+9));
      }else{
        this.bullets.push(new Bullet(bx,this.y));
      }
      this.shootCd=this.shootDelay;
    }
    SND.shoot();
  }
  takeDamage(){
    if(this.hasShield){this.hasShield=false;this.invFrames=30;return 'shield';}
    if(this.invFrames===0){this.health--;this.invFrames=90;return 'hit';}
    return null;
  }
  applyPowerup(kind){
    if(kind==='double')this.doubleTimer=600;
    else if(kind==='shield')this.hasShield=true;
    else if(kind==='slow')this.slowTimer=300;
    else if(kind==='life')this.health=Math.min(this.health+1,this.maxHp);
    else if(kind==='wpn_spread'){this.weapon='spread';this.weaponTimer=700;}
    else if(kind==='wpn_rapid'){this.weapon='rapid';this.weaponTimer=600;}
    else if(kind==='wpn_rocket'){this.weapon='rocket';this.weaponTimer=500;}
  }
  get slowActive(){return this.slowTimer>0;}
  draw(){
    if(this.invFrames>0&&Math.floor(this.invFrames/5)%2===0)return;
    const x=Math.round(this.x),y=Math.round(this.y);
    if(this.hasShield){
      ctx.shadowColor=AC;ctx.shadowBlur=22;
      ctx.globalAlpha=0.22;ctx.fillStyle=AC;
      ctx.beginPath();ctx.arc(x,y,38,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle=AC;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,38,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
    }
    // Wings
    ctx.fillStyle='#3264ff';
    ctx.beginPath();ctx.moveTo(x-22,y-10);ctx.lineTo(x-5,y-26);ctx.lineTo(x+12,y-6);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x-22,y+10);ctx.lineTo(x-5,y+26);ctx.lineTo(x+12,y+6);ctx.closePath();ctx.fill();
    // Body (triangle pointing right)
    ctx.fillStyle=this.doubleTimer>0?'#ffdc00':AC;
    ctx.beginPath();ctx.moveTo(x-28,y+12);ctx.lineTo(x+32,y);ctx.lineTo(x-28,y-12);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#00a0d2';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x-28,y+12);ctx.lineTo(x+32,y);ctx.lineTo(x-28,y-12);ctx.closePath();ctx.stroke();
    // Thruster with glow
    const fl=rndInt(12,22);
    ctx.shadowColor='#ff8c00';ctx.shadowBlur=20;
    ctx.fillStyle='#ff8c00';
    ctx.beginPath();ctx.moveTo(x-28,y-5);ctx.lineTo(x-28-fl,y);ctx.lineTo(x-28,y+5);ctx.closePath();ctx.fill();
    ctx.shadowBlur=10;ctx.fillStyle='#ffdc00';
    ctx.beginPath();ctx.moveTo(x-28,y-2);ctx.lineTo(x-28-(fl>>1),y);ctx.lineTo(x-28,y+2);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    // Cockpit with glow
    ctx.shadowColor=AC;ctx.shadowBlur=14;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+12,y,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=AC;ctx.beginPath();ctx.arc(x+12,y,4,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    if(this.doubleTimer>0){
      ctx.strokeStyle=rgba(255,220,0,0.4);ctx.lineWidth=1;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(x,y-26);ctx.lineTo(x+40,y-26);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y+26);ctx.lineTo(x+40,y+26);ctx.stroke();
      ctx.setLineDash([]);
    }
    for(const b of this.bullets)b.draw();
  }
  get rect(){return{x:this.x-26,y:this.y-13,w:52,h:26};}
}

// ── Enemy (spawn from right, move left, vertical bounce) ──────────────────────
const ENEMY_CFG={
  fighter:{spdRange:[3.0,5.5],hp:1,W:42,H:26,score:100,cdRange:[70,140],drop:0.20},
  scout:  {spdRange:[5.5,8.5],hp:1,W:30,H:20,score:150,cdRange:[90,180],drop:0.20},
  heavy:  {spdRange:[1.5,2.8],hp:3,W:56,H:38,score:300,cdRange:[50,100],drop:0.45},
};
class Enemy{
  constructor(kind){
    const c=ENEMY_CFG[kind];
    this.kind=kind;this.hp=c.hp;this.maxHp=c.hp;
    this.W=c.W;this.H=c.H;this.score=c.score;this.dropChance=c.drop;
    this.x=GW+this.W;this.y=rnd(50,GH-50);
    this.speed=rnd(...c.spdRange);this.vy=rnd(-1.2,1.2);
    this.shootTimer=rndInt(...c.cdRange);this.cdRange=c.cdRange;
    this.bullets=[];this.dead=false;
  }
  update(ts){
    ts=ts===undefined?1:ts;
    this.x-=this.speed*ts;this.y+=this.vy*ts;
    if(this.y<40||this.y>GH-40)this.vy*=-1;
    if(this.x<-this.W-20)this.dead=true;
    this.shootTimer-=ts;
    if(this.shootTimer<=0){
      this.shootTimer=rndInt(...this.cdRange);
      const bx=this.x-this.W/2;
      if(this.kind==='heavy'){
        for(const a of[175,180,185])this.bullets.push(new EnemyBullet(bx,this.y,a));
      }else{
        this.bullets.push(new EnemyBullet(bx,this.y));
      }
    }
    this.bullets=this.bullets.filter(b=>{b.update();return !b.dead;});
  }
  takeHit(){this.hp--;return this.hp<=0;}
  shouldDrop(){return Math.random()<this.dropChance;}
  draw(){
    const x=Math.round(this.x),y=Math.round(this.y);
    ctx.save();ctx.translate(x,y);
    if(this.kind==='fighter'){
      // Triangle pointing left
      ctx.fillStyle='#dc3232';
      ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,-13);ctx.lineTo(20,13);ctx.closePath();ctx.fill();
      ctx.fillStyle='#8c0000';
      ctx.beginPath();ctx.moveTo(10,-13);ctx.lineTo(-2,-26);ctx.lineTo(-12,-5);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(10,13);ctx.lineTo(-2,26);ctx.lineTo(-12,5);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(-18,0,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffdc00';ctx.beginPath();ctx.arc(-18,0,2,0,Math.PI*2);ctx.fill();
    }else if(this.kind==='scout'){
      ctx.fillStyle='#a01edc';
      ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,-10);ctx.lineTo(14,10);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,0,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#a01edc';ctx.beginPath();ctx.arc(-4,0,2,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.ellipse(0,0,28,19,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c85a00';ctx.beginPath();ctx.ellipse(0,0,14,11,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#969696';ctx.fillRect(-33,-22,18,6);ctx.fillRect(-33,16,18,6);
      ctx.fillStyle='#ffdc00';ctx.beginPath();ctx.arc(-26,0,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(-26,0,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#282828';ctx.fillRect(-22,-30,44,6);
      ctx.fillStyle='#32c832';ctx.fillRect(-22,-30,Math.max(0,44*this.hp/this.maxHp),6);
    }
    ctx.restore();
    for(const b of this.bullets)b.draw();
  }
  get rect(){return{x:this.x-this.W/2,y:this.y-this.H/2,w:this.W,h:this.H};}
}

// ── Dreadnought ────────────────────────────────────────────────────────────────
class Dreadnought{
  constructor(){
    this.x=GW+130;this.y=GH/2;
    this.hp=25;this.maxHp=25;this.W=114;this.H=78;
    this.score=5000;this.dropCount=4;
    this.targetX=GW*0.72;this.moveTimer=0;this.entering=true;
    this.shootTimer=100;
    this.laserActive=false;this.laserTimer=0;this.laserCd=0;
    this.LASER_DUR=105;this.LASER_CD=230;
    this.bullets=[];this.dead=false;
  }
  get phase(){return this.hp<=12?2:1;}
  update(ts){
    ts=ts===undefined?1:ts;
    if(this.x>this.targetX){this.x-=2.5*ts;}
    else{
      this.entering=false;
      this.moveTimer+=ts;
      const amp=this.phase===2?195:155,spd=this.phase===2?0.020:0.014;
      this.y=clamp(GH/2+Math.sin(this.moveTimer*spd)*amp,60,GH-60);
    }
    if(!this.entering){
      const delay=this.phase===2?38:58;
      this.shootTimer-=ts;
      if(this.shootTimer<=0){
        this.shootTimer=delay;
        const angs=this.phase===2?range(151,212,8):range(155,210,11);
        for(const a of angs)this.bullets.push(new EnemyBullet(this.x-this.W/2,this.y,a));
      }
      if(this.phase===2){
        if(this.laserActive){
          this.laserTimer-=ts;
          if(this.laserTimer<=0){this.laserActive=false;this.laserCd=this.LASER_CD;}
        }else if(this.laserCd>0){this.laserCd-=ts;}
        else{this.laserActive=true;this.laserTimer=this.LASER_DUR;}
      }
    }
    this.bullets=this.bullets.filter(b=>{b.update();return !b.dead;});
  }
  takeHit(){if(this.entering)return false;this.hp--;return this.hp<=0;}
  getLaserRect(){
    if(!this.laserActive||this.laserTimer<=0)return null;
    return{x:0,y:Math.round(this.y)-6,w:Math.max(0,Math.round(this.x-this.W/2)),h:12};
  }
  draw(){
    const x=Math.round(this.x),y=Math.round(this.y),mt=this.moveTimer;
    if(this.entering){
      ctx.save();ctx.globalAlpha=0.45+0.25*Math.sin(Date.now()*0.01);
      ctx.fillStyle='#50b4ff';ctx.beginPath();ctx.ellipse(x,y,76,52,0,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;ctx.restore();
    }
    // Laser beam (drawn before save/translate)
    const lr=this.getLaserRect();
    if(lr&&lr.w>0){
      const flicker=this.laserTimer>this.LASER_DUR-20||this.laserTimer<20;
      if(!flicker||Math.floor(this.laserTimer/3)%2){
        ctx.shadowColor='#ff3030';ctx.shadowBlur=18;
        ctx.fillStyle='rgb(255,40,40)';ctx.fillRect(lr.x,lr.y,lr.w,lr.h);
        ctx.shadowBlur=8;ctx.fillStyle='rgb(255,160,160)';ctx.fillRect(lr.x,lr.y+4,lr.w,4);
        ctx.shadowBlur=4;ctx.fillStyle='#fff';ctx.fillRect(lr.x,lr.y+5,lr.w,2);
        ctx.shadowBlur=0;
      }
    }
    ctx.save();ctx.translate(x,y);
    const wc=this.phase===2?'rgb(90,10,10)':'rgb(70,10,10)';
    ctx.fillStyle=wc;
    ctx.beginPath();ctx.moveTo(-52,-28);ctx.lineTo(-14,-68);ctx.lineTo(32,-22);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-52,28);ctx.lineTo(-14,68);ctx.lineTo(32,22);ctx.closePath();ctx.fill();
    ctx.fillStyle=this.phase===2?'rgb(100,15,15)':'rgb(72,12,12)';
    ctx.beginPath();ctx.ellipse(0,0,57,39,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgb(155,28,28)';ctx.beginPath();ctx.ellipse(0,0,29,20,0,0,Math.PI*2);ctx.fill();
    for(const dy of[-30,-15,0,15,30]){
      ctx.fillStyle='#969696';ctx.fillRect(-66,dy-4,24,8);
      ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(-64,dy,4,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle=this.phase===2?'rgb(255,40,40)':'#ff8c00';
    ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=this.phase===2?'rgb(255,200,0)':'#ffdc00';
    ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();
    if(this.phase===2){
      for(let i=0;i<8;i++){
        const a=mt*4*Math.PI/180+i*Math.PI/4;
        ctx.fillStyle='rgb(255,80,80)';ctx.beginPath();ctx.arc(Math.cos(a)*22,Math.sin(a)*22,3,0,Math.PI*2);ctx.fill();
      }
    }
    const bc=this.phase===2?'#dc3232':'#ff8c00';
    ctx.fillStyle='#282828';ctx.fillRect(-55,-58,110,10);
    ctx.fillStyle=bc;ctx.fillRect(-55,-58,Math.max(0,110*this.hp/this.maxHp),10);
    ctx.strokeStyle='#969696';ctx.lineWidth=1;ctx.strokeRect(-55,-58,110,10);
    ctx.restore();
    for(const b of this.bullets)b.draw();
  }
  get rect(){return{x:this.x-this.W/2,y:this.y-this.H/2,w:this.W,h:this.H};}
}

// ── FinalBoss (Crimson Overlord) ── 5 phases, 100 shots to win ────────────────
class FinalBoss{
  constructor(){
    this.x=GW+150;this.y=GH/2;
    this.shots=0;this.maxShots=100;
    this.W=150;this.H=100;
    this.score=15000;this.dropCount=6;
    this.targetX=GW*0.73;this.moveTimer=0;this.entering=true;
    this.shootTimer=100;
    this.LASER_DUR=105;
    this._lasers=[
      {active:false,timer:0,cd:0,yOff:-32},
      {active:false,timer:0,cd:0,yOff:32},
      {active:false,timer:0,cd:0,yOff:0}
    ];
    this.bullets=[];this.dead=false;this._prevPhase=1;
    this.dying=false;this.dyingTimer=0;
  }
  get phase(){const r=this.shots/this.maxShots;if(r>=0.80)return 5;if(r>=0.60)return 4;if(r>=0.40)return 3;if(r>=0.20)return 2;return 1;}
  get hp(){return this.maxShots-this.shots;}
  get maxHp(){return this.maxShots;}
  update(ts){
    ts=ts===undefined?1:ts;
    if(this.dying){
      this.dyingTimer+=ts;
      const t=this.dyingTimer;
      if(t===1){for(const l of this._lasers)l.active=false;}
      if(t<150&&Math.floor(t)%8===0){
        explosions.push(new Explosion(this.x+(Math.random()-0.5)*130,this.y+(Math.random()-0.5)*85,true));
        SND.boom();
      }
      if(t%12===0&&t<160)screenShake=Math.min(20,t*0.14+4);
      if(t>=220){this.dead=true;recordOverlordVictory();gameState='victory';SND.victory();}
      this.bullets=this.bullets.filter(b=>{b.update();return !b.dead;});
      return;
    }
    if(this.x>this.targetX){this.x-=2.0*ts;}
    else{
      this.entering=false;
      this.moveTimer+=ts;
      const spd=[0.014,0.017,0.021,0.025,0.030][this.phase-1];
      const amp=[105,120,140,155,168][this.phase-1];
      this.y=clamp(GH/2+Math.sin(this.moveTimer*spd)*amp,70,GH-70);
    }
    if(!this.entering){
      if(this._prevPhase!==this.phase){flashAlpha=90;screenShake=12;this._prevPhase=this.phase;}
      const delays=[68,52,40,30,22][this.phase-1];
      this.shootTimer-=ts;
      if(this.shootTimer<=0){
        this.shootTimer=delays;
        const bx=this.x-this.W/2,by=this.y,ph=this.phase;
        if(ph===1){for(const a of[168,180,192])this.bullets.push(new EnemyBullet(bx,by,a));}
        else if(ph===2){for(let i=0;i<5;i++)this.bullets.push(new EnemyBullet(bx,by,155+i*12.5));}
        else if(ph===3){
          for(let i=0;i<7;i++)this.bullets.push(new EnemyBullet(bx,by,148+i*9.3));
          for(const a of[128,232])this.bullets.push(new EnemyBullet(bx,by,a));
        }else if(ph===4){
          for(let i=0;i<9;i++)this.bullets.push(new EnemyBullet(bx,by,142+i*9.0));
          for(const a of[120,152,208,240])this.bullets.push(new EnemyBullet(bx,by,a));
        }else{
          for(let i=0;i<11;i++)this.bullets.push(new EnemyBullet(bx,by,137+i*9.2));
          for(const a of[108,128,148,212,232,252])this.bullets.push(new EnemyBullet(bx,by,a));
        }
      }
      const laserCD=[999,200,175,150,125][this.phase-1];
      const activeLasers=[0,1,2,2,3][this.phase-1];
      for(let i=0;i<this._lasers.length;i++){
        const l=this._lasers[i];
        if(i>=activeLasers){l.active=false;continue;}
        if(l.active){l.timer-=ts;if(l.timer<=0){l.active=false;l.cd=laserCD+i*35;}}
        else if(l.cd>0){l.cd-=ts;}
        else{l.active=true;l.timer=this.LASER_DUR;}
      }
    }
    this.bullets=this.bullets.filter(b=>{b.update();return !b.dead;});
  }
  takeHit(){
    if(this.entering)return false;
    this.shots++;if(this.shots>=this.maxShots){vibrate([80,40,80]);return true;}return false;
  }
  getLaserRects(){
    return this._lasers.filter(l=>l.active&&l.timer>0).map(l=>{
      const lw=Math.max(0,Math.round(this.x-this.W/2));
      const lh=l.yOff===0?8:12;
      return{x:0,y:Math.round(this.y+l.yOff)-Math.floor(lh/2),w:lw,h:lh};
    });
  }
  _drawDying(){
    const t=this.dyingTimer;
    const x=Math.round(this.x),y=Math.round(this.y);
    const shk=t<150?Math.min(16,t*0.13+3):Math.max(0,(220-t)*0.3);
    const sx=(Math.random()-0.5)*shk,sy=(Math.random()-0.5)*shk;
    // Shockwave rings
    if(t>=50&&t<170){
      const sw=(t-50)*3.8,sa=Math.max(0,1-(t-50)/120)*0.75;
      ctx.strokeStyle=rgba(255,30,30,sa);ctx.lineWidth=6;
      ctx.shadowColor='#ff0000';ctx.shadowBlur=28;
      ctx.beginPath();ctx.arc(x,y,sw,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    }
    if(t>=90&&t<200){
      const sw=(t-90)*3.2,sa=Math.max(0,1-(t-90)/110)*0.5;
      ctx.strokeStyle=rgba(255,180,40,sa);ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(x,y,sw,0,Math.PI*2);ctx.stroke();
    }
    if(t>=130&&t<210){
      const sw=(t-130)*4.5,sa=Math.max(0,1-(t-130)/80)*0.4;
      ctx.strokeStyle=rgba(255,255,180,sa);ctx.lineWidth=8;
      ctx.beginPath();ctx.arc(x,y,sw,0,Math.PI*2);ctx.stroke();
    }
    // Boss body (visible until t=190)
    if(t<190){
      const whiteAlpha=Math.max(0,(t-100)/90);
      const crGrow=Math.min(t*0.55,44);
      const cr=Math.round(26+crGrow);
      ctx.save();ctx.translate(x+sx,y+sy);
      ctx.fillStyle='#4b0000';
      ctx.beginPath();ctx.moveTo(-70,-20);ctx.lineTo(-20,-80);ctx.lineTo(30,-30);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(-70,20);ctx.lineTo(-20,80);ctx.lineTo(30,30);ctx.closePath();ctx.fill();
      ctx.fillStyle='#8b0000';
      ctx.beginPath();ctx.moveTo(-60,-18);ctx.lineTo(-18,-70);ctx.lineTo(24,-28);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(-60,18);ctx.lineTo(-18,70);ctx.lineTo(24,28);ctx.closePath();ctx.fill();
      ctx.fillStyle='#3a0000';ctx.beginPath();ctx.ellipse(0,0,70,48,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#8b0000';ctx.beginPath();ctx.ellipse(0,0,41,29,0,0,Math.PI*2);ctx.fill();
      // Growing core
      ctx.shadowColor='#ff0000';ctx.shadowBlur=cr*1.2;
      ctx.fillStyle='rgb(180,0,0)';ctx.beginPath();ctx.arc(0,0,cr,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgb(255,80,0)';ctx.beginPath();ctx.arc(0,0,cr-8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgb(255,220,60)';ctx.beginPath();ctx.arc(0,0,cr-18,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      if(whiteAlpha>0){
        ctx.globalAlpha=Math.min(1,whiteAlpha);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,88,60,0,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
      }
      ctx.restore();
    }
    // Full-screen white flash (t=170-195)
    if(t>=170&&t<=198){
      const fa=t<180?(t-170)/10:1-(t-180)/18;
      ctx.fillStyle=rgba(255,255,255,Math.min(1,Math.max(0,fa))*0.96);
      ctx.fillRect(0,0,GW,GH);
    }
    // Existing bullets still fly
    for(const b of this.bullets)b.draw();
  }
  draw(){
    if(this.dying){this._drawDying();return;}
    const x=Math.round(this.x),y=Math.round(this.y),mt=this.moveTimer,ph=this.phase;
    if(this.entering){
      ctx.save();ctx.globalAlpha=0.45+0.25*Math.sin(Date.now()*0.01);
      ctx.fillStyle='#50b4ff';ctx.beginPath();ctx.ellipse(x,y,100,68,0,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;ctx.restore();
    }
    for(const l of this._lasers){
      if(!l.active||l.timer<=0)continue;
      const lx=Math.max(0,Math.round(this.x-this.W/2));
      const ly=Math.round(this.y+l.yOff);
      const lh=l.yOff===0?8:12;
      const flicker=l.timer>this.LASER_DUR-20||l.timer<20;
      if(!flicker||Math.floor(l.timer/3)%2){
        ctx.shadowColor='#ff2020';ctx.shadowBlur=20;
        ctx.fillStyle='rgb(200,0,0)';ctx.fillRect(0,ly-Math.floor(lh/2),lx,lh);
        ctx.shadowBlur=10;ctx.fillStyle='rgb(255,60,60)';ctx.fillRect(0,ly-Math.floor(lh/2)+2,lx,lh-4);
        ctx.shadowBlur=4;ctx.fillStyle='#fff';ctx.fillRect(0,ly-1,lx,2);
        ctx.shadowBlur=0;
      }
    }
    ctx.save();ctx.translate(x,y);
    ctx.fillStyle='#4b0000';
    ctx.beginPath();ctx.moveTo(-70,-20);ctx.lineTo(-20,-80);ctx.lineTo(30,-30);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-70,20);ctx.lineTo(-20,80);ctx.lineTo(30,30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8b0000';
    ctx.beginPath();ctx.moveTo(-60,-18);ctx.lineTo(-18,-70);ctx.lineTo(24,-28);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-60,18);ctx.lineTo(-18,70);ctx.lineTo(24,28);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a0000';ctx.beginPath();ctx.ellipse(0,0,70,48,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8b0000';ctx.beginPath();ctx.ellipse(0,0,41,29,0,0,Math.PI*2);ctx.fill();
    for(const dy of[-36,-20,-6,6,20,36]){
      ctx.fillStyle='#969696';ctx.fillRect(-82,dy-4,20,8);
      ctx.fillStyle='rgb(180,20,20)';ctx.beginPath();ctx.arc(-80,dy,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(-80,dy,3,0,Math.PI*2);ctx.fill();
    }
    const pulse=Math.abs(Math.sin(mt*0.08))*8,cr=Math.round(26+pulse);
    ctx.fillStyle='rgb(180,0,0)';ctx.beginPath();ctx.arc(0,0,cr,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgb(255,40,40)';ctx.beginPath();ctx.arc(0,0,cr-8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgb(255,160,0)';ctx.beginPath();ctx.arc(0,0,cr-16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
    if(ph>=2){for(let i=0;i<4;i++){const a=mt*4*Math.PI/180+i*Math.PI/2;ctx.fillStyle='rgb(255,60,60)';ctx.beginPath();ctx.arc(Math.cos(a)*32,Math.sin(a)*32,4,0,Math.PI*2);ctx.fill();}}
    if(ph>=3){for(let i=0;i<6;i++){const a=mt*5*Math.PI/180+i*Math.PI/3;ctx.fillStyle='rgb(255,120,0)';ctx.beginPath();ctx.arc(Math.cos(a)*50,Math.sin(a)*50,3,0,Math.PI*2);ctx.fill();}}
    if(ph>=4){for(let i=0;i<8;i++){const a=-mt*6*Math.PI/180+i*Math.PI/4;ctx.fillStyle='rgb(255,200,0)';ctx.beginPath();ctx.arc(Math.cos(a)*66,Math.sin(a)*66,2.5,0,Math.PI*2);ctx.fill();}}
    if(ph===5){
      for(let i=0;i<10;i++){const a=mt*8*Math.PI/180+i*Math.PI/5;ctx.fillStyle='rgb(255,255,100)';ctx.beginPath();ctx.arc(Math.cos(a)*82,Math.sin(a)*82,2,0,Math.PI*2);ctx.fill();}
      ctx.shadowColor='#ff0000';ctx.shadowBlur=30;
      ctx.strokeStyle='rgba(255,30,30,0.4)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,0,cr+12+Math.sin(mt*0.2)*4,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
    }
    const bc=ph===5?'rgb(255,0,255)':ph===4?'rgb(255,60,0)':ph===3?'rgb(255,20,20)':ph===2?'rgb(200,40,40)':'#8b0000';
    ctx.fillStyle='#282828';ctx.fillRect(-65,-70,130,10);
    ctx.fillStyle=bc;ctx.fillRect(-65,-70,Math.max(0,130*this.hp/this.maxHp),10);
    ctx.strokeStyle='#969696';ctx.lineWidth=1;ctx.strokeRect(-65,-70,130,10);
    ctx.restore();
    for(const b of this.bullets)b.draw();
  }
  get rect(){return{x:this.x-this.W/2,y:this.y-this.H/2,w:this.W,h:this.H};}
}

let _joyPY=parseFloat(localStorage.getItem('ss_joyPY')||'0');

function getFirePos(){return{x:_firePX||Math.round(GW*0.87),y:_firePY||Math.round(GH*0.78)};}

const pauseRect={x:GW/2-30,y:GH-70,w:60,h:36};
let joyFid=null,joyBase=null,joyNub=null,fireFid=null,pauseFid=null;
function joyDirs(){
  if(!joyBase)return{};
  const dx=joyNub.x-joyBase.x,dy=joyNub.y-joyBase.y;
  if(Math.hypot(dx,dy)<JOY_DEAD)return{};
  const a=Math.atan2(dy,dx)*180/Math.PI;
  if(a>=-157.5&&a<-112.5)return{left:1,up:1};
  if(a>=-112.5&&a<-67.5)return{up:1};
  if(a>=-67.5&&a<-22.5)return{right:1,up:1};
  if(a>=-22.5&&a<22.5)return{right:1};
  if(a>=22.5&&a<67.5)return{right:1,down:1};
  if(a>=67.5&&a<112.5)return{down:1};
  if(a>=112.5&&a<157.5)return{left:1,down:1};
  return{left:1};
}
function touchKeys(){const j=joyDirs();return{left:!!j.left,right:!!j.right,up:!!j.up,down:!!j.down,fire:fireFid!==null};}
function touchDown(id,px,py){
  const fp=getFirePos(),fr=getFireR();
  if(Math.hypot(px-fp.x,py-fp.y)<=fr){fireFid=id;return'fire';}
  if(joyStatic){
    const jp=getJoyPos();
    if(joyFid===null){joyFid=id;joyBase={x:jp.x,y:jp.y};joyNub={x:px,y:py};return'joy';}
  }else{
    if(px<GW*0.6&&joyFid===null){joyFid=id;joyBase={x:px,y:py};joyNub={x:px,y:py};return'joy';}
  }
  return null;
}
function touchUp(id){if(id===joyFid){joyFid=null;joyBase=null;joyNub=null;}if(id===fireFid)fireFid=null;if(id===pauseFid)pauseFid=null;}
function touchMove(id,px,py){
  if(id===joyFid&&joyBase){
    if(joyStatic){joyNub={x:px,y:py};}
    else{
      const dx=px-joyBase.x,dy=py-joyBase.y,d=Math.hypot(dx,dy);
      if(d>JOY_MAX_R){const s=JOY_MAX_R/d;joyNub={x:joyBase.x+dx*s,y:joyBase.y+dy*s};}
      else joyNub={x:px,y:py};
    }
  }
  const fp=getFirePos(),fr=getFireR();
  if(id===fireFid&&Math.hypot(px-fp.x,py-fp.y)>fr+10)fireFid=null;
}
function clearTouch(){joyFid=null;joyBase=null;joyNub=null;fireFid=null;pauseFid=null;}
function drawTouch(){
  const jp=getJoyPos();
  if(joyBase){
    const{x:cx,y:cy}=joyBase;
    ctx.beginPath();ctx.arc(cx,cy,JOY_BASE_R,0,Math.PI*2);
    ctx.fillStyle=rgba(55,80,130,0.2);ctx.fill();
    ctx.strokeStyle=rgba(140,190,255,0.45);ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,JOY_MAX_R,0,Math.PI*2);
    ctx.strokeStyle=rgba(140,190,255,0.15);ctx.lineWidth=2;ctx.stroke();
    const{x:nx,y:ny}=joyNub;
    ctx.beginPath();ctx.arc(nx,ny,JOY_NUB_R,0,Math.PI*2);
    ctx.fillStyle=rgba(80,130,210,0.82);ctx.fill();
    ctx.strokeStyle=rgba(180,220,255,0.9);ctx.lineWidth=3;ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(jp.x,jp.y,JOY_BASE_R,0,Math.PI*2);
    ctx.fillStyle=rgba(55,80,130,joyStatic?0.18:0.09);ctx.fill();
    ctx.strokeStyle=rgba(140,190,255,joyStatic?0.35:0.18);ctx.lineWidth=2;ctx.stroke();
    if(joyStatic){
      ctx.beginPath();ctx.arc(jp.x,jp.y,JOY_NUB_R,0,Math.PI*2);
      ctx.fillStyle=rgba(80,130,210,0.22);ctx.fill();
    }
  }
  const fp=getFirePos(),fr=getFireR();
  const fon=fireFid!==null;
  ctx.beginPath();ctx.arc(fp.x,fp.y,fr,0,Math.PI*2);
  ctx.fillStyle=rgba(130,25,25,fon?0.78:0.31);ctx.fill();
  ctx.strokeStyle=rgba(255,90,90,fon?0.9:0.55);ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(fp.x,fp.y,fr-14,0,Math.PI*2);
  ctx.fillStyle=rgba(255,50,50,fon?0.72:0.43);ctx.fill();
}

function _layInputDown(x,y){
  const jp=getJoyPos(),fp=getFirePos(),fr=getFireR();
  const jd=Math.hypot(x-jp.x,y-jp.y),fd=Math.hypot(x-fp.x,y-fp.y);
  if(jd<=JOY_BASE_R+14){
    if(jd>JOY_BASE_R-18){_layDrag='joy_resize';_layRSt={d:jd,sc:joyScale,cx:jp.x,cy:jp.y};}
    else{_layDrag='joy';}
    return;
  }
  if(fd<=fr+14){
    if(fd>fr-18){_layDrag='fire_resize';_layRSt={d:fd,sc:_fireSz,cx:fp.x,cy:fp.y};}
    else{_layDrag='fire';}
    return;
  }
  const k=hitBtn(x,y);
  if(k==='lay_joy_mode'){joyStatic=!joyStatic;SND.uiClick();}
  else if(k==='lay_done'){saveTouchLayout();gameState='settings';SND.uiClick();}
  else if(k==='lay_reset'){resetTouchLayout();applyJoyScale();SND.uiClick();}
}
function _layInputMove(x,y){
  if(_layDrag==='joy'){
    _joyPX=clamp(x,JOY_BASE_R+4,GW-JOY_BASE_R-4);
    _joyPY=clamp(y,JOY_BASE_R+4,GH-JOY_BASE_R-4);
  }else if(_layDrag==='fire'){
    const fr=getFireR();
    _firePX=clamp(x,fr+4,GW-fr-4);
    _firePY=clamp(y,fr+4,GH-fr-4);
  }else if(_layDrag==='joy_resize'&&_layRSt){
    const d=Math.hypot(x-_layRSt.cx,y-_layRSt.cy);
    joyScale=clamp(parseFloat((_layRSt.sc*(d/_layRSt.d)).toFixed(2)),0.4,2.2);
    applyJoyScale();
  }else if(_layDrag==='fire_resize'&&_layRSt){
    const d=Math.hypot(x-_layRSt.cx,y-_layRSt.cy);
    _fireSz=clamp(parseFloat((_layRSt.sc*(d/_layRSt.d)).toFixed(2)),0.4,2.2);
  }
}
function _layInputUp(){_layDrag=null;_layRSt=null;}
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

// ── Keyboard ───────────────────────────────────────────────────────────────────
const KB={};
window.addEventListener('keydown',e=>{KB[e.code]=true;});
window.addEventListener('keyup',e=>{KB[e.code]=false;});
const DEFAULT_BINDINGS={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',fire:'Space'};
function loadBindings(){try{return Object.assign({...DEFAULT_BINDINGS},JSON.parse(localStorage.getItem('ss_keys')||'{}'));}catch(e){return{...DEFAULT_BINDINGS};}}
function saveBindings(){try{localStorage.setItem('ss_keys',JSON.stringify(bindings));}catch(e){}}
let bindings=loadBindings(),rebindAction=null;
function keyName(code){
  const m={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Space:'SPACE',Enter:'ENTER',Escape:'ESC',ShiftLeft:'L-SHIFT',ShiftRight:'R-SHIFT',ControlLeft:'L-CTRL',ControlRight:'R-CTRL',AltLeft:'L-ALT',AltRight:'R-ALT',Backspace:'BACK',Tab:'TAB'};
  if(m[code])return m[code];
  if(code.startsWith('Key'))return code.slice(3);
  if(code.startsWith('Digit'))return code.slice(5);
  if(code.startsWith('Numpad'))return'NP'+code.slice(6);
  return code.slice(0,8);
}
function kbKeys(){return{
  left:!!(KB[bindings.left]||KB.KeyA),right:!!(KB[bindings.right]||KB.KeyD),
  up:!!(KB[bindings.up]||KB.KeyW),down:!!(KB[bindings.down]||KB.KeyS),
  fire:!!(KB[bindings.fire]||KB.KeyZ||KB.KeyX),
};}
function mergeKeys(kb,tk){return{left:kb.left||tk.left,right:kb.right||tk.right,up:kb.up||tk.up,down:kb.down||tk.down,fire:kb.fire||tk.fire};}

function _drawFighterAt(cx,cy){

  ctx.fillStyle='#dc3232';

  ];

  });

  EDEF.forEach((e)=>{

    const ef=t-et;
    const ex=GW+40-(et-e.st)*e.spd;
    const r=Math.round(Math.sin(ef/28*Math.PI)*52);
    if(r<=0)return;
    ctx.shadowColor='#ff8c00';ctx.shadowBlur=r;

  });

    ctx.translate(GW/2,GH/2-58);

    ctx.fillText('SHOOTER',0,84);
    ctx.shadowBlur=0;ctx.restore();
  }
  // "by CtrlZett" credit
  if(t>=175){
    const cf=Math.min(1,(t-175)/32);
    ctx.globalAlpha=cf;
    ctx.font='bold 26px monospace';ctx.textAlign='center';
    ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=18;
    ctx.fillText('by CtrlZett',GW/2,GH/2+94);
    ctx.shadowBlur=0;
    if(t>=220){
      const pulse=0.5+0.5*Math.sin(t*0.13);
      ctx.globalAlpha=cf*pulse*0.3;
      ctx.fillStyle='#ffd700';
      ctx.beginPath();ctx.ellipse(GW/2,GH/2+92,108,20,0,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // Skip hint
  if(t>=45){
    ctx.globalAlpha=0.42+0.28*Math.sin(t*0.07);
    ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillStyle='#888888';
    ctx.fillText('Нажми чтобы пропустить',GW/2,GH-16);
    ctx.globalAlpha=1;
  }
  // Fade overlays
  const fadeInA=t<25?1-t/25:0;
  const fadeOutA=t>=283?Math.min(1,(t-283)/17):0;
  const fadeA=Math.max(fadeInA,fadeOutA);
  if(fadeA>0){ctx.fillStyle=`rgba(0,0,0,${fadeA})`;ctx.fillRect(0,0,GW,GH);}
}

// ── Collisions ─────────────────────────────────────────────────────────────────
function doCollisions(){
  if(!player)return;
  const pr=player.rect;
  // Player bullets vs enemies
  for(const b of player.bullets){
    if(b.dead)continue;
    for(const e of enemies){
      if(e.dead)continue;
      if(rectsOverlap(b.rect,e.rect)){
        b.dead=true;
        if(b instanceof RocketBullet){explosions.push(new Explosion(b.x,b.y,true));SND.boom();}
        if(e.takeHit()){
          e.dead=true;score+=addKill(e.score);kills++;
          explosions.push(new Explosion(e.x,e.y,true));SND.boom();
          if(e.shouldDrop())powerups.push(new PowerUp(e.x,e.y));
        }else{explosions.push(new Explosion(e.x,e.y));}
        break;
      }
    }
  }
  // Player bullets vs bosses
  for(const boss of bosses){
    if(boss.dead||boss.dying)continue;
    const prevPhase=boss.phase!==undefined?boss.phase:1;
    for(const b of player.bullets){
      if(b.dead)continue;
      if(rectsOverlap(b.rect,boss.rect)){
        b.dead=true;
        if(boss.takeHit()){
          if(boss instanceof FinalBoss){
            // Dying animation — victory triggered at animation end
            boss.dying=true;boss.dyingTimer=0;
            score+=boss.score;
            for(let i=0;i<boss.dropCount;i++)
              powerups.push(new PowerUp(boss.x+Math.random()*130-65,boss.y+Math.random()*90-45));
            const wpns=['wpn_spread','wpn_rapid','wpn_rocket'];
            powerups.push(new PowerUp(boss.x,boss.y-30,wpns[rndInt(0,2)]));
            SND.bossDie();screenShake=22;vibrate([100,40,100]);
          }else{
            boss.dead=true;score+=boss.score;
            const cnt=boss instanceof MiniBoss?3:5;
            for(let i=0;i<cnt;i++)
              explosions.push(new Explosion(boss.x+Math.random()*110-55,boss.y+Math.random()*80-40,true));
            SND.bossDie();flashAlpha=120;screenShake=15;vibrate([60,30,60]);
            for(let i=0;i<boss.dropCount;i++)
              powerups.push(new PowerUp(boss.x+Math.random()*130-65,boss.y+Math.random()*90-45));
            const wpns2=['wpn_spread','wpn_rapid','wpn_rocket'];
            powerups.push(new PowerUp(boss.x,boss.y-30,wpns2[rndInt(0,2)]));
            if(gameMode==='arcade'){kills+=boss instanceof MiniBoss?3:6;}
          }
        }else{
          explosions.push(new Explosion(boss.x,boss.y));
          if(gameMode==='arcade'&&!bossEnraged&&boss instanceof Dreadnought&&boss.phase===2&&prevPhase===1){
            bossEnraged=true;enrageFlash=35;SND.bossEnrage();
          }
        }
      }
    }
  }
  // Enemy/boss bullets vs player
  for(const s of [...enemies,...bosses]){
    for(const eb of s.bullets){
      if(eb.dead)continue;
      if(rectsOverlap(eb.rect,pr)){
        eb.dead=true;
        const dmg=player.takeDamage();
        if(dmg==='hit'){explosions.push(new Explosion(player.x,player.y));screenShake=6;flashAlpha=40;vibrate(25);combo=0;comboTimer=0;}
        else if(dmg==='shield'){screenShake=4;}
      }
    }
  }
  // Boss lasers vs player
  for(const boss of bosses){
    if(boss.dead||boss.dying)continue;
    const lrs=boss instanceof FinalBoss?boss.getLaserRects():
              boss instanceof Dreadnought?[boss.getLaserRect()].filter(Boolean):[];
    for(const lr of lrs){
      if(lr&&rectsOverlap(lr,pr)){
        const dmg=player.takeDamage();
        if(dmg==='hit'){explosions.push(new Explosion(player.x,player.y));flashAlpha=30;vibrate(25);combo=0;comboTimer=0;}
      }
    }
  }
  // Enemy ram
  for(const e of enemies){
    if(e.dead)continue;
    if(rectsOverlap(e.rect,pr)){
      if(e instanceof Mine)e.takeHit(); // triggers 8-bullet explosion
      e.dead=true;explosions.push(new Explosion(e.x,e.y,true));SND.boom();
      const dmg=player.takeDamage();
      if(dmg==='hit'){explosions.push(new Explosion(player.x,player.y));screenShake=8;combo=0;comboTimer=0;}
    }
  }
  // Mine explosion bullets vs player
  for(const eb of freeEBullets){
    if(eb.dead)continue;
    if(rectsOverlap(eb.rect,pr)){
      eb.dead=true;
      const dmg=player.takeDamage();
      if(dmg==='hit'){explosions.push(new Explosion(player.x,player.y));screenShake=5;flashAlpha=35;combo=0;comboTimer=0;}
      else if(dmg==='shield'){screenShake=3;}
    }
  }
  // Asteroids vs player bullets
  for(const a of asteroids){
    for(const b of player.bullets){
      if(b.dead)continue;
      if(rectsOverlap(b.rect,a.rect)){
        b.dead=true;
        if(a.takeHit()){
          a.dead=true;score+=a.score;
          explosions.push(new Explosion(a.x,a.y,a.big));SND.boom();
          if(a.shouldDrop())powerups.push(new PowerUp(a.x,a.y));
        }else{
          explosions.push(new Explosion(a.x,a.y,false));SND.hit();
        }
      }
    }
    // Asteroid vs player ram
    if(!a.dead&&rectsOverlap(a.rect,pr)){
      a.dead=true;explosions.push(new Explosion(a.x,a.y,true));SND.boom();
      const dmg=player.takeDamage();
      if(dmg==='hit'){explosions.push(new Explosion(player.x,player.y));screenShake=7;flashAlpha=35;combo=0;comboTimer=0;}
    }
  }
  // Powerups
  for(const pu of powerups){
    if(pu.dead)continue;
    if(rectsOverlap(pu.rect,pr)){pu.dead=true;player.applyPowerup(pu.kind);SND.powerup();}
  }
  if(player.health<=0){if(gameMode==='arcade'){saveArcadeRecord();globalFlushKills();}gameState='game_over';}
}

// ── Levels state machine ───────────────────────────────────────────────────────
function updateLevels(ts){
  if(lvPhase==='intro'){
    if(lvIntroTimer>0){lvIntroTimer-=1;return;}
    if(LEVELS[lvIdx][1]===0){lvPhase='boss_wait';lvNextBossTimer=60;}
    else{lvPhase='normal';spawnTimer=0;}
    return;
  }
  if(lvPhase==='normal'){
    const[,count,scoreTgt]=LEVELS[lvIdx];
    if(scoreTgt>0&&score>=scoreTgt)lvEnemiesLeft=0;
    if(lvEnemiesLeft>0){
      spawnTimer+=1;
      if(spawnTimer>=spawnDelay){spawnEnemyLevel();lvEnemiesLeft--;spawnTimer=0;}
    }else if(enemies.length===0&&bosses.length===0){
      if(lvBossQueue.length>0){lvPhase='boss_wait';lvNextBossTimer=90;}
      else{triggerLevelComplete();}
    }
  }else if(lvPhase==='boss_wait'){
    lvNextBossTimer-=1;
    if(lvNextBossTimer<=0){
      if(!lvBossQueue.length){triggerLevelComplete();return;}
      const next=lvBossQueue.shift();
      if(next==='FINAL'){
        lvPhase='final_delay';lvFinalDelayTimer=240;vigAlpha=60;SND.bossWarn();
      }else if(next==='dread'){
        bosses.push(new Dreadnought());lvPhase='boss';
        warnText='DREADNOUGHT';warnTimer=190;SND.bossWarn();
      }else{
        bosses.push(new MiniBoss());lvPhase='boss';
        warnText='MARAUDER';warnTimer=130;SND.bossWarn();
      }
    }
  }else if(lvPhase==='boss'){
    if(bosses.filter(b=>!b.dead).length===0){
      if(lvBossQueue.length>0){lvPhase='boss_wait';lvNextBossTimer=90;}
      else{triggerLevelComplete();}
    }
  }else if(lvPhase==='final_delay'){
    lvFinalDelayTimer-=1;vigAlpha=60;
    if(lvFinalDelayTimer%20===0&&lvFinalDelayTimer>0)screenShake=3;
    if(lvFinalDelayTimer<=0){
      bosses.push(new FinalBoss());lvPhase='final_boss';
      warnText='CRIMSON OVERLORD';warnTimer=200;SND.bossWarn();
    }
  }else if(lvPhase==='final_boss'){
    const fb=bosses.find(b=>b instanceof FinalBoss&&!b.dead);
    if(fb)vigAlpha=(1-fb.hp/fb.maxHp)*220;
  }
}
function triggerLevelComplete(){
  lvCompleteTimer=180;gameState='level_complete';SND.levelComplete();
  if(lvIdx+1<20){maxUnlocked=Math.max(maxUnlocked,lvIdx+1);saveProgress(maxUnlocked);}
}

// ── Update ─────────────────────────────────────────────────────────────────────
function update(){
  _updateMusic();
  if(gameState==='intro'){updateIntro();return;}
  if(gameState==='layout'){for(const s of stars)s.update();for(const r of bgRocks)r.update();return;}
  if(gameState==='level_complete'){
    for(const s of stars)s.update();
    for(const r of bgRocks)r.update();
    lvCompleteTimer--;
    if(lvCompleteTimer<=0){
      lvIdx++;level=lvIdx+1;
      if(lvIdx>=LEVELS.length){gameState='victory';SND.victory();return;}
      score=0;
      if(player){player.health=Math.min(player.health+1,player.maxHp);player.invFrames=120;}
      enemies.length=0;bosses.length=0;powerups.length=0;freeEBullets.length=0;asteroids.length=0;
      const ld=LEVELS[lvIdx];
      lvEnemiesLeft=ld[1];lvBossQueue=[...ld[3]];
      lvNextBossTimer=0;lvFinalDelayTimer=0;lvIntroTimer=140;
      spawnDelay=Math.max(30,90-lvIdx*3);spawnTimer=0;
      lvPhase='intro';warnText='';warnTimer=0;vigAlpha=0;
      gameState='playing';
    }
    return;
  }
  if(gameState!=='playing')return;
  for(const s of stars)s.update();
  for(const r of bgRocks)r.update();
  if(screenShake>0)screenShake*=0.82;
  if(flashAlpha>0)flashAlpha=Math.max(0,flashAlpha-15);
  if(enrageFlash>0)enrageFlash--;
  if(comboTimer>0){comboTimer--;if(!comboTimer)combo=0;}
  if(warnTimer>0)warnTimer--;

  const ts=player&&player.slowActive?0.45:1.0;
  const keys=mergeKeys(kbKeys(),touchKeys());
  if(player)player.update(keys);

  if(gameMode==='arcade'){
    const hasBigBoss=bosses.some(b=>b instanceof Dreadnought&&!b.dead);
    if(!hasBigBoss){spawnTimer++;if(spawnTimer>=spawnDelay){spawnEnemyArcade();spawnTimer=0;}}
    enemies=enemies.filter(e=>{e.update(ts);return !e.dead;});
    bosses=bosses.filter(b=>{if(!b.dead)b.update(ts);return !b.dead;});
    if(kills>=killsLevel*level){
      level++;spawnDelay=Math.max(28,90-level*10);bossEnraged=false;checkArcadeBoss();
    }
  }else{
    updateLevels(ts);
    enemies=enemies.filter(e=>{e.update(ts);return !e.dead;});
    bosses=bosses.filter(b=>{if(!b.dead)b.update(ts);return !b.dead;});
    const fb=bosses.find(b=>b instanceof FinalBoss&&!b.dead);
    if(lvPhase!=='final_delay'&&lvPhase!=='final_boss')vigAlpha=Math.max(0,vigAlpha-2);
    else if(!fb&&lvPhase==='final_boss')vigAlpha=Math.max(0,vigAlpha-2);
  }

  powerups=powerups.filter(p=>{p.update();return !p.dead;});
  doCollisions();
  enemies=enemies.filter(e=>!e.dead);
  bosses=bosses.filter(b=>!b.dead);
  // Asteroids
  asteroidTimer++;
  const astLvl=gameMode==='arcade'?level:lvIdx+1;
  if(astLvl>=4&&enemies.length+bosses.length>0){
    const interval=Math.max(180,420-astLvl*14);
    if(asteroidTimer>=interval){
      asteroidTimer=0;
      asteroids.push(new Asteroid(Math.random()<0.35));
    }
  }
  for(const a of asteroids)a.update(player&&player.slowActive?0.4:1);
  asteroids=asteroids.filter(a=>!a.dead);
  freeEBullets=freeEBullets.filter(b=>{b.update();return !b.dead;});
  explosions=explosions.filter(e=>{e.update();return !e.dead;});
}

const _PLANETS=[
  {x:GW*0.78,y:GH*0.28,r:120,vx:0.06,c0:'#2a4888',c1:'#0e1c3a',
   bands:[[0,-28,0.88,12],[0,14,0.78,10],[0,48,0.60,8]]},

  {x:GW*1.18,y:GH*0.16,r:72,vx:0.04,c0:'#226642',c1:'#020a05',
   bands:[[0,-18,0.84,10],[0,22,0.72,8]]},
];
function drawPlanets(){
  for(const p of _PLANETS){
    p.x-=p.vx;if(p.x<-p.r-20)p.x=GW+p.r+20;
    const{x,y,r,c0,c1,bands}=p;
    ctx.save();
    ctx.globalAlpha=0.06;ctx.fillStyle='#5599ff';
    ctx.beginPath();ctx.arc(x,y,r+16,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    const g=ctx.createRadialGradient(x-r*0.28,y-r*0.28,r*0.08,x,y,r);
    g.addColorStop(0,c0);g.addColorStop(0.55,c1);g.addColorStop(1,'#020304');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.09;
    for(const[ox,oy,rr,th]of bands){ctx.fillStyle='#88aadd';ctx.beginPath();ctx.ellipse(x+ox,y+oy,r*rr,th,0,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
    const rs=ctx.createRadialGradient(x+r*0.35,y,r*0.2,x,y,r);
    rs.addColorStop(0,'rgba(0,0,0,0)');rs.addColorStop(0.6,'rgba(0,0,0,0)');rs.addColorStop(1,'rgba(0,0,0,0.72)');
    ctx.fillStyle=rs;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}
// ── Draw ───────────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle='#000510';ctx.fillRect(0,0,GW,GH);

  const _nb1=ctx.createRadialGradient(GW*0.68,GH*0.35,10,GW*0.68,GH*0.35,310);

  const _nb2=ctx.createRadialGradient(GW*0.22,GH*0.75,5,GW*0.22,GH*0.75,190);
  _nb2.addColorStop(0,rgba(6,22,42,0.45));_nb2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=_nb2;ctx.fillRect(0,0,GW,GH);
  const _nb3=ctx.createRadialGradient(GW*0.45,GH*0.15,5,GW*0.45,GH*0.15,220);
  _nb3.addColorStop(0,rgba(4,28,14,0.38));_nb3.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=_nb3;ctx.fillRect(0,0,GW,GH);
  const _nb4=ctx.createRadialGradient(GW*0.85,GH*0.82,5,GW*0.85,GH*0.82,170);
  _nb4.addColorStop(0,rgba(28,6,8,0.32));_nb4.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=_nb4;ctx.fillRect(0,0,GW,GH);
  for(const s of stars)s.draw();
  for(const r of bgRocks)r.draw();
  drawPlanets();

  if(gameState==='intro'){drawIntro();return;}
  if(gameState==='menu'){drawMenu();return;}
  if(gameState==='level_select'){drawLevelSelect();return;}
  if(gameState==='settings'){drawSettings();return;}
  if(gameState==='layout'){drawLayout();return;}
  if(gameState==='stats'){drawStats();return;}

  // Slow tint
  if(player&&player.slowActive){ctx.fillStyle=rgba(60,30,160,0.08);ctx.fillRect(0,0,GW,GH);}

  // Screen shake
  let sx=0,sy=0;
  if(screenShake>0){sx=(Math.random()-0.5)*screenShake*2;sy=(Math.random()-0.5)*screenShake*2;}
  ctx.save();ctx.translate(Math.round(sx),Math.round(sy));

  for(const a of asteroids)a.draw();
  for(const eb of freeEBullets)eb.draw();
  for(const e of enemies)e.draw();
  for(const b of bosses)if(!b.dead)b.draw();
  for(const p of powerups)p.draw();
  for(const e of explosions)e.draw();
  if(player&&(gameState==='playing'||gameState==='paused'||gameState==='level_complete'))player.draw();
  ctx.restore();

  // Flash
  if(flashAlpha>0){ctx.fillStyle=rgba(255,60,60,flashAlpha/255);ctx.fillRect(0,0,GW,GH);}
  // Enrage flash
  if(enrageFlash>0){ctx.fillStyle=rgba(255,0,0,enrageFlash/35*0.51);ctx.fillRect(0,0,GW,GH);}
  // Crimson Overlord flicker (phase 3+)
  const _fbLive=bosses.find(b=>b instanceof FinalBoss&&!b.dead);
  if(_fbLive&&_fbLive.phase>=3){
    const _fph=_fbLive.phase-2;
    const _fsin=Math.abs(Math.sin(Date.now()*0.005+_fbLive.shots*0.15));
    ctx.fillStyle=rgba(180,0,0,_fsin*_fph*0.055);ctx.fillRect(0,0,GW,GH);
    if(_fbLive.phase===5&&_fsin>0.85){ctx.fillStyle=rgba(255,30,30,0.08);ctx.fillRect(0,0,GW,GH);}
  }
  // Vignette
  if(vigAlpha>0)drawVignette();

  if(gameState==='playing'){
    btnRects={};
    drawHUD();
    if(touchMode)drawTouch();
    if(warnTimer>0)drawWarning();
    if(gameMode==='levels'&&lvIntroTimer>0)drawLevelIntro();
  }else if(gameState==='paused'){drawPause();}
  else if(gameState==='game_over'){drawGameOver();}
  else if(gameState==='victory'){drawVictory();}
  else if(gameState==='level_complete'){drawLevelComplete();}
  drawCheatMsg();
}

function drawVignette(){
  const thickness=80,alpha=Math.min(255,vigAlpha);
  for(let i=0;i<thickness;i+=4){
    const t=1-(i/thickness),a=alpha*t*t/255;
    ctx.strokeStyle=rgba(180,0,0,a);ctx.lineWidth=5;
    ctx.strokeRect(i,i,GW-i*2,GH-i*2);
  }
}

function drawHUD(){

function drawBossHPBar(){
  const boss=bosses.filter(b=>!b.dead&&!b.dying).slice(-1)[0];
  if(!boss)return;
  let name,col;
  if(boss instanceof FinalBoss){
    name='CRIMSON OVERLORD';
    col=boss.phase===5?'rgb(255,0,255)':boss.phase===4?'rgb(255,60,0)':boss.phase===3?'rgb(255,20,20)':boss.phase===2?'rgb(200,40,40)':'#8b0000';
  }else if(boss instanceof Dreadnought){
    name='DREADNOUGHT';col=boss.phase===2?'#dc3232':'#ff8c00';
  }else{
    name='MARAUDER';col='#ffdc00';

  const bw=360,bh=16,bx=GW/2-bw/2,by=8;
  ctx.fillStyle='#282828';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=col;ctx.fillRect(bx,by,Math.max(0,bw*boss.hp/boss.maxHp),bh);

  const ph=boss instanceof FinalBoss?` ★${boss.phase}/5  ${boss.shots}/${boss.maxShots}`:'';
  ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.textAlign='center';
  ctx.fillText(name+'   '+boss.hp+'/'+boss.maxHp+ph,GW/2,by+bh+14);
}
