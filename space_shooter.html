      ctx.fillStyle='#ffdc00';ctx.font='bold 12px monospace';ctx.textAlign='left';ctx.fillText(rank+' '+e.name,GW/2+24,y);
      ctx.fillStyle='#ff6688';ctx.font='10px monospace';ctx.fillText(e.score.toLocaleString()+' pts',GW/2+24,y+13);
      ctx.fillStyle='#445566';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(e.date,GW-34,y+13);
    });
  }else if(!globalStatsLoaded){
    // Loading spinner
    const sp=Date.now()*0.003;
    ctx.strokeStyle='#ff44cc';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(col2,190,18,sp,sp+Math.PI*1.5);ctx.stroke();
    ctx.fillStyle='#445566';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('Loading...',col2,225);
  }else{
    const list=globalLeaderboard.length>0?globalLeaderboard:overlordHoF.slice(0,8);
    if(list.length===0){
      ctx.fillStyle='#334455';ctx.font='13px sans-serif';ctx.textAlign='center';
      ctx.fillText('No victors yet...',col2,175);ctx.font='11px sans-serif';
      ctx.fillText('Defeat the Overlord to be first!',col2,195);
    }else{
      list.forEach((e,i)=>{
        const y=145+i*42;
        const isYou=e.name===playerCallsign;
        ctx.fillStyle=isYou?rgba(90,50,0,0.75):rgba(15,28,50,0.75);
        roundRect(GW/2+14,y-14,GW/2-44,34,6);ctx.fill();
        ctx.strokeStyle=isYou?'#ffaa00':'#1e3050';ctx.lineWidth=isYou?2:1;
        roundRect(GW/2+14,y-14,GW/2-44,34,6);ctx.stroke();
        const rank=i===0?'👑':i===1?'🥈':i===2?'🥉':(i+1)+'.';
        ctx.fillStyle=isYou?'#ffdc00':'#88aacc';
        ctx.font=`bold ${isYou?13:12}px monospace`;ctx.textAlign='left';
        ctx.fillText(rank+' '+e.name,GW/2+24,y+1);
        ctx.fillStyle=isYou?'#ff8800':'#ff6688';ctx.font='11px monospace';
        ctx.fillText(e.score.toLocaleString()+'  pts',GW/2+24,y+16);
        ctx.fillStyle='#445566';ctx.font='10px sans-serif';ctx.textAlign='right';
        ctx.fillText(e.date,GW-34,y+16);
      });
    }
  }
}

// ── Button handling ────────────────────────────────────────────────────────────
function hitBtn(x,y){
  for(const[k,r]of Object.entries(btnRects))if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return k;
  return null;
}
function handleBtn(key){
  if(!key)return;
  SND.uiClick();
  if(key==='m_stats'){gameState='stats';globalStatsLoaded=false;fetchGlobalData();return;}
  if(key==='stats_back'){gameState='menu';return;}
  if(key==='m_settings'){gameState='settings';return;}
  if(key==='set_back'){rebindAction=null;wipeConfirm=false;gameState='menu';return;}
  if(key==='set_layout'){gameState='layout';_layDrag=null;return;}
  if(key==='set_part_on'){particlesEnabled=true;saveGameSettings();return;}
  if(key==='set_part_off'){particlesEnabled=false;saveGameSettings();return;}
  if(key==='set_vib_on'){vibrateEnabled=true;saveGameSettings();return;}
  if(key==='set_vib_off'){vibrateEnabled=false;saveGameSettings();return;}
  for(let _ai=0;_ai<4;_ai++){if(key==='set_accent_'+_ai){setAccent(_ai);return;}}
  if(key==='set_wipe'){wipeConfirm=true;SND.uiClick();return;}
  if(key==='set_wipe_no'){wipeConfirm=false;SND.uiClick();return;}
  if(key==='set_wipe_yes'){wipeConfirm=false;wipeSettingsData();return;}
  for(const a of['up','down','left','right','fire']){
    if(key==='set_bind_'+a){
      rebindAction=(rebindAction===a?null:a);SND.uiClick();return;
    }
  }
  if(key==='set_bind_reset'){bindings={...DEFAULT_BINDINGS};saveBindings();SND.uiClick();return;}
  if(key==='m_wipe'){wipeConfirm=true;SND.uiClick();return;}
  if(key==='m_wipe_no'){wipeConfirm=false;SND.uiClick();return;}
  if(key==='m_wipe_yes'){wipeConfirm=false;wipeProgressData();return;}
  if(key==='m_title'){
    const now=Date.now();
    if(now-titleTapTime>3000)titleTapCount=0;
    titleTapTime=now;titleTapCount++;
    if(titleTapCount>=7){
      titleTapCount=0;maxUnlocked=19;saveProgress(19);
      cheatMsg='★ ALL LEVELS UNLOCKED ★';cheatTimer=240;
    }
    return;
  }
  if(key==='m_arcade'){wipeConfirm=false;menuSel=0;startGame('arcade');return;}
  if(key==='m_levels'){wipeConfirm=false;gameState='level_select';lsCursor=0;return;}
  if(key==='m_phone'){touchMode=!touchMode;return;}
  if(key==='ls_back'){gameState='menu';return;}
  if(key.startsWith('ls_')){const i=parseInt(key.slice(3));if(i<=maxUnlocked){startGame('levels',i);}return;}
  if(key==='p_resume'){gameState='playing';clearTouch();return;}
  if(key==='p_pmenu'){gameState='menu';clearTouch();return;}
  if(key==='g_retry'){startGame(gameMode,gameMode==='levels'?lvIdx:0);return;}
  if(key==='g_gmenu'){gameState='menu';return;}
  if(key==='v_retry'){startGame(gameMode,gameMode==='levels'?0:0);return;}
  if(key==='v_vmenu'){gameState='menu';return;}
}

// ── Canvas pos ────────────────────────────────────────────────────────────────
function canvasPos(cx,cy){
  const r=canvas.getBoundingClientRect();
  return{x:(cx-r.left)/scale,y:(cy-r.top)/scale};
}

// ── Pointer events ────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{
  initAudio();
  const{x,y}=canvasPos(e.clientX,e.clientY);
  if(gameState==='intro'){skipIntro();return;}
  if(gameState==='layout'){_layInputDown(x,y);return;}
  if(gameState==='settings'){
    const h=hitBtn(x,y);
    if(h==='set_vol_sl'){_setSlider='vol';_setSliderVal(x);return;}
    if(h==='set_sfx_sl'){_setSlider='sfx';_setSliderVal(x);return;}
    handleBtn(h);return;
  }
  if(gameState==='playing'){
    if(hitBtn(x,y)==='hud_pause'){gameState='paused';clearTouch();return;}
    if(touchMode)touchDown(-1,x,y);
  }else{handleBtn(hitBtn(x,y));}
});
canvas.addEventListener('mouseup',e=>{_setSlider=null;touchUp(-1);if(gameState==='layout')_layInputUp();});
canvas.addEventListener('mousemove',e=>{
  if(e.buttons){
    const{x,y}=canvasPos(e.clientX,e.clientY);
    if(_setSlider){_setSliderVal(x);return;}
    if(gameState==='layout'){_layInputMove(x,y);return;}
    if(gameState==='playing'&&touchMode){touchMove(-1,x,y);}
  }
});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  for(const t of e.changedTouches){
    const{x,y}=canvasPos(t.clientX,t.clientY);
    if(gameState==='intro'){skipIntro();break;}
    if(gameState==='layout'){_layInputDown(x,y);break;}
    if(gameState==='settings'){
      const h=hitBtn(x,y);
      if(h==='set_vol_sl'){_setSlider='vol';_setSliderVal(x);break;}
      if(h==='set_sfx_sl'){_setSlider='sfx';_setSliderVal(x);break;}
      handleBtn(h);break;
    }
    if(gameState==='playing'){
      if(hitBtn(x,y)==='hud_pause'){gameState='paused';clearTouch();break;}
      if(touchMode)touchDown(t.identifier,x,y);
    }else{handleBtn(hitBtn(x,y));}
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  _setSlider=null;
  for(const t of e.changedTouches){touchUp(t.identifier);if(gameState==='layout')_layInputUp();}
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const{x,y}=canvasPos(t.clientX,t.clientY);
    if(_setSlider){_setSliderVal(x);break;}
    if(gameState==='layout'){_layInputMove(x,y);break;}
    else touchMove(t.identifier,x,y);
  }
},{passive:false});
window.addEventListener('keydown',e=>{
  if(rebindAction!==null){
    if(e.code!=='Escape'&&e.code!=='F11'&&e.code!=='F5'){
      bindings[rebindAction]=e.code;saveBindings();SND.uiClick();
    }
    rebindAction=null;e.preventDefault();return;
  }
  if(gameState==='intro'){skipIntro();return;}
  if(e.code==='Escape'){
    if(gameState==='playing'){gameState='paused';}
    else if(gameState==='paused'){gameState='playing';clearTouch();}
    else if(gameState==='level_select'){gameState='menu';}
    else if(gameState==='settings'){gameState='menu';}
    else if(gameState==='layout'){saveTouchLayout();gameState='settings';}
    else if(gameState==='stats'){gameState='menu';}
    else if(gameState==='game_over'||gameState==='victory'){gameState='menu';}
  }
  if(e.key&&e.key.length===1){
    cheatBuf=(cheatBuf+e.key).slice(-10);
    if(cheatBuf.endsWith('lavelall')){
      cheatBuf='';maxUnlocked=19;saveProgress(19);
      cheatMsg='★ ALL LEVELS UNLOCKED ★';cheatTimer=240;
    }
  }
});

// ── Game loop (capped at 60 fps so speed is the same on 120 Hz screens) ───────
initStars();
let _lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-_lastTs<15.5)return;  // skip frame if less than ~1/64 s has passed
  _lastTs=ts;
  update();draw();
}
requestAnimationFrame(ts=>{_lastTs=ts;requestAnimationFrame(loop);});
</script>
