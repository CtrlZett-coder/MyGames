function drawLevelSelect(){
  ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.fillStyle=AC;
  ctx.fillText('SELECT LEVEL',GW/2,40);
  btnRects={ls_back:{x:14,y:8,w:80,h:32}};
  ctx.fillStyle='#224466';roundRect(14,8,80,32,6);ctx.fill();
  ctx.strokeStyle=AC;ctx.lineWidth=1.5;roundRect(14,8,80,32,6);ctx.stroke();
  ctx.fillStyle=AC;ctx.font='14px sans-serif';ctx.textAlign='center';
  ctx.fillText('< BACK',54,29);
  for(let i=0;i<20;i++){
    const col=i%5,row=Math.floor(i/5);
    const cW=128,cH=88,gX=26,gY=22;
    const gTW=4*(cW+gX)+cW,gTH=3*(cH+gY)+cH;
    const sx=Math.round(GW/2-gTW/2),sy=Math.round((GH+50)/2-gTH/2);
    const x=sx+col*(cW+gX),y=sy+row*(cH+gY),w=cW,h=cH;
    btnRects['ls_'+i]={x,y,w,h};
    const unlocked=i<=maxUnlocked,sel=lsCursor===i;
    ctx.fillStyle=unlocked?(sel?rgba(0,120,200,0.9):rgba(20,50,90,0.8)):rgba(20,20,30,0.8);
    roundRect(x,y,w,h,10);ctx.fill();
    ctx.strokeStyle=unlocked?(sel?AC:'#224488'):'#333';ctx.lineWidth=2;
    roundRect(x,y,w,h,10);ctx.stroke();
    ctx.fillStyle=unlocked?'#fff':'#444';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('LV '+(i+1),x+w/2,y+34);
    if(!unlocked){ctx.fillStyle='#555';ctx.font='20px sans-serif';ctx.fillText('🔒',x+w/2,y+66);}
    else{const sc=LEVELS[i][2];ctx.fillStyle='#ffdc00';ctx.font='14px monospace';if(sc)ctx.fillText(sc+'pts',x+w/2,y+62);}
  }
}

function drawStats(){
  ctx.fillStyle=rgba(0,0,10,0.97);ctx.fillRect(0,0,GW,GH);
  btnRects={};
  // Back button
  btnRects['stats_back']={x:14,y:8,w:80,h:32};
  ctx.fillStyle='#224466';roundRect(14,8,80,32,6);ctx.fill();
  ctx.strokeStyle=AC;ctx.lineWidth=1.5;roundRect(14,8,80,32,6);ctx.stroke();
  ctx.fillStyle=AC;ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('< BACK',54,29);
  // Title
  ctx.font='bold 26px monospace';ctx.textAlign='center';
  ctx.fillStyle='#ffdc00';ctx.shadowColor='#ffdc00';ctx.shadowBlur=10;
  ctx.fillText('★  STATISTICS  ★',GW/2,48);ctx.shadowBlur=0;

  // ── World Stats bar ────────────────────────────────────────────────────────
  const ws=getWorldStats();
  ctx.strokeStyle='#1e3050';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(30,58);ctx.lineTo(GW-30,58);ctx.stroke();
  const wcx=GW/3;
  const wStats=[
    ['🌐 GAMES PLAYED',ws.plays.toLocaleString(),'#66aaff'],
    ['💀 TOTAL KILLS',ws.kills.toLocaleString(),'#ff6666'],
    ['👑 OVERLORD SLAIN',ws.overlords.toLocaleString(),'#ff44cc'],
  ];
  wStats.forEach(([lbl,val,col],i)=>{
    const wx=Math.round(GW*(i+0.5)/3);
    ctx.fillStyle=rgba(10,20,40,0.8);roundRect(wx-82,63,164,40,8);ctx.fill();
    ctx.strokeStyle=col+'66';ctx.lineWidth=1;roundRect(wx-82,63,164,40,8);ctx.stroke();
    ctx.fillStyle='#556677';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(lbl,wx,75);
    if(_fbOK&&!globalStatsLoaded){
      ctx.strokeStyle=col;ctx.lineWidth=2;
      const sp2=Date.now()*0.004+i;
      ctx.beginPath();ctx.arc(wx,82,9,sp2,sp2+Math.PI*1.3);ctx.stroke();
    }else{
      ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=6;
      ctx.font='bold 17px monospace';ctx.fillText(val,wx,93);ctx.shadowBlur=0;
    }
  });
  ctx.beginPath();ctx.moveTo(30,110);ctx.lineTo(GW-30,110);ctx.stroke();

  // ── Two columns: Personal Records | Hall of Fame ───────────────────────────
  const col1=GW*0.25,col2=GW*0.75;
  ctx.strokeStyle='#1e3050';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(GW/2,114);ctx.lineTo(GW/2,GH-20);ctx.stroke();

  // Left: Your Records
  ctx.fillStyle=AC;ctx.font='bold 13px sans-serif';ctx.textAlign='center';
  ctx.fillText('YOUR RECORDS',col1,128);
  const myStats=[
    ['Best score',arcadeBestScore.toLocaleString(),'#ffdc00'],
    ['Best combo',arcadeBestCombo+'x','#ff8c00'],
    ['Best wave',arcadeBestLevel,'#32c832'],
    ['Games played',statsGames,'#888'],
    ['Total kills',statsKills.toLocaleString(),'#cc4444'],
    ['Overlord wins',statsOverlordWins,'#ff44cc'],
  ];
  myStats.forEach(([label,val,col],i)=>{
    const y=148+i*38;
    ctx.fillStyle=rgba(10,22,36,0.7);roundRect(28,y-14,GW/2-50,28,5);ctx.fill();
    ctx.fillStyle='#667788';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText(label,38,y+4);
    ctx.fillStyle=col;ctx.font='bold 13px monospace';ctx.textAlign='right';ctx.fillText(val,GW/2-34,y+4);
  });

  // Right: Leaderboard with tabs
  const rLbX=GW/2+14,rLbW=GW/2-28;
  const tabW3=Math.round(rLbW/2)-4,tabH3=24;
  const t1x3=rLbX,t2x3=rLbX+tabW3+8;

  const arcSel=statsLeaderboardTab==='arcade';
  ctx.fillStyle=arcSel?AC+'33':'rgba(10,20,35,0.8)';roundRect(t1x3,116,tabW3,tabH3,5);ctx.fill();
  ctx.strokeStyle=arcSel?AC:'#334455';ctx.lineWidth=arcSel?2:1;roundRect(t1x3,116,tabW3,tabH3,5);ctx.stroke();
  ctx.fillStyle=arcSel?AC:'#556677';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillText('🏆 ARCADE TOP',t1x3+tabW3/2,130);
  btnRects['stats_tab_arcade']={x:t1x3,y:116,w:tabW3,h:tabH3};

  const ovlSel=statsLeaderboardTab==='overlord';
  ctx.fillStyle=ovlSel?'#ff44cc33':'rgba(10,20,35,0.8)';roundRect(t2x3,116,tabW3,tabH3,5);ctx.fill();
  ctx.strokeStyle=ovlSel?'#ff44cc':'#334455';ctx.lineWidth=ovlSel?2:1;roundRect(t2x3,116,tabW3,tabH3,5);ctx.stroke();
  ctx.fillStyle=ovlSel?'#ff44cc':'#556677';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillText('👑 OVERLORDS',t2x3+tabW3/2,130);
  btnRects['stats_tab_overlord']={x:t2x3,y:116,w:tabW3,h:tabH3};

  const isArcTab=statsLeaderboardTab==='arcade';
  const tabColor=isArcTab?AC:'#ff44cc';

  // Scrollable list area geometry
  const listTop=143,listBot=GH-20,listH=listBot-listTop;
  const entH=30;

  if(_fbOK&&!globalStatsLoaded){
    const sp=Date.now()*0.003;
    ctx.strokeStyle=tabColor;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(col2,listTop+listH/2,18,sp,sp+Math.PI*1.5);ctx.stroke();
    ctx.fillStyle='#445566';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText('Loading...',col2,listTop+listH/2+35);
  }else{
    const list=isArcTab
      ?(_fbOK?globalArcadeLb:[])
      :(_fbOK?globalLeaderboard:overlordHoF);

    if(!authUid){
      ctx.fillStyle='rgba(255,180,60,0.9)';ctx.font='13px sans-serif';ctx.textAlign='center';
      ctx.fillText('Sign in to save your score to the leaderboard',col2,listTop+22);
    }
    if(!_fbOK&&isArcTab){
      ctx.fillStyle='#334455';ctx.font='11px sans-serif';ctx.textAlign='center';
      ctx.fillText('Firebase not connected',col2,listTop+40+(authUid?0:22));
    }else if(list.length===0){
      ctx.fillStyle='#334455';ctx.font='13px sans-serif';ctx.textAlign='center';
      ctx.fillText('No entries yet...',col2,listTop+40);
      ctx.font='11px sans-serif';
      ctx.fillText(isArcTab?'Play arcade to be first!':'Defeat the Overlord first!',col2,listTop+60);
    }else{
      // Find player's index in full list
      const _myUid=authUid||deviceId;
      const playerIdx=list.findIndex(e=>e.uid===_myUid||e.name===playerCallsign);
      const totalH=list.length*entH;
      _lbMaxScroll=Math.max(0,totalH-listH);
      _lbScrollY=Math.max(0,Math.min(_lbScrollY,_lbMaxScroll));

      // Clip to list area
      ctx.save();
      ctx.beginPath();ctx.rect(rLbX-2,listTop,rLbW+4,listH);ctx.clip();

      list.forEach((e,i)=>{
        const ey=listTop+i*entH-_lbScrollY+entH/2;
        if(ey<listTop-entH||ey>listBot+entH)return;
        const isYou=e.uid===(authUid||deviceId)||e.name===playerCallsign;
        ctx.fillStyle=isYou?'rgba(180,100,0,0.85)':'rgba(15,28,50,0.75)';
        roundRect(rLbX,ey-12,rLbW,27,5);ctx.fill();
        ctx.strokeStyle=isYou?'#ffcc00':i<3?'#334466':'#1e3050';
        ctx.lineWidth=isYou?2.5:1;
        roundRect(rLbX,ey-12,rLbW,27,5);ctx.stroke();
        const rank=i===0?'👑':i===1?'🥈':i===2?'🥉':(i+1)+'.';
        ctx.fillStyle=isYou?'#ffee44':'#88aacc';
        ctx.font=`bold ${isYou?12:11}px monospace`;ctx.textAlign='left';
        ctx.fillText((rank+' '+e.name).substring(0,isYou?17:16),rLbX+8,ey+1);
        ctx.fillStyle=isYou?'#ffaa00':'#ff6688';ctx.font='10px monospace';
        ctx.fillText(e.score.toLocaleString()+' pts',rLbX+8,ey+13);
        ctx.fillStyle='#556677';ctx.font='9px sans-serif';ctx.textAlign='right';
        ctx.fillText(e.date||'',rLbX+rLbW-6,ey+13);
      });
      ctx.restore();

      // Scrollbar
      if(_lbMaxScroll>0){
        const sbX=rLbX+rLbW+2,sbW=4;
        const sbTrackH=listH;
        const sbThumbH=Math.max(20,sbTrackH*listH/totalH);
        const sbThumbY=listTop+(sbTrackH-sbThumbH)*(_lbScrollY/_lbMaxScroll);
        ctx.fillStyle='#1a2a3a';ctx.fillRect(sbX,listTop,sbW,sbTrackH);
        ctx.fillStyle=tabColor+'99';
        ctx.beginPath();ctx.roundRect?ctx.roundRect(sbX,sbThumbY,sbW,sbThumbH,2):ctx.rect(sbX,sbThumbY,sbW,sbThumbH);
        ctx.fill();
      }

      // "YOUR RANK" bar if player is outside visible range
      if(playerIdx>=0){
        const visFirst=Math.floor(_lbScrollY/entH);
        const visLast=visFirst+Math.ceil(listH/entH);
        if(playerIdx<visFirst||playerIdx>visLast){
          ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(rLbX,listBot-20,rLbW,20);
          ctx.fillStyle='#ffee44';ctx.font='bold 11px monospace';ctx.textAlign='center';
          ctx.fillText('► YOUR RANK: #'+(playerIdx+1)+' of '+list.length,col2,listBot-6);
        }
      }

      // Scroll hint if list is scrollable and hasn't been scrolled yet
      if(_lbMaxScroll>0&&_lbScrollY===0&&list.length>0){
        ctx.fillStyle='#334455';ctx.font='9px sans-serif';ctx.textAlign='center';
        ctx.fillText('↕ scroll',col2,listBot-4);
      }
    }
  }
}

// ── Button handling ────────────────────────────────────────────────────────────
function hitBtn(x,y){
  for(const[k,r]of Object.entries(btnRects))if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return k;
  return null;
}
function handleBtn(key){
  if(!key)return;
  SND.uiClick();
  if(key==='m_signin'){
    // Reset form to sign-in mode before showing
    if(_authMode!=='signin')authToggleMode();
    document.getElementById('auth-err').textContent='';
    document.getElementById('auth-email').value='';
    document.getElementById('auth-pass').value='';
    const ol=document.getElementById('auth-overlay');
    if(ol){ol.style.display='flex';setTimeout(()=>document.getElementById('auth-email').focus(),50);}
    return;
  }
  if(key==='m_account'){showAccount();return;}

  if(key==='m_stats'){fadeToScreen(()=>{gameState='stats';globalStatsLoaded=false;_lbScrollY=0;fetchGlobalData();});return;}
  if(key==='stats_back'){fadeToScreen(()=>{gameState='menu';});return;}
  if(key==='stats_tab_arcade'){statsLeaderboardTab='arcade';_lbScrollY=0;return;}
  if(key==='stats_tab_overlord'){statsLeaderboardTab='overlord';_lbScrollY=0;return;}
  if(key==='m_settings'){fadeToScreen(()=>{gameState='settings';});return;}
  if(key==='set_back'){fadeToScreen(()=>{rebindAction=null;wipeConfirm=false;gameState='menu';});return;}
  if(key==='set_layout'){fadeToScreen(()=>{gameState='layout';_layDrag=null;});return;}
  if(key==='set_part_on'){particlesEnabled=true;saveGameSettings();return;}
  if(key==='set_part_off'){particlesEnabled=false;saveGameSettings();return;}
  if(key==='set_vib_on'){vibrateEnabled=true;saveGameSettings();return;}
  if(key==='set_vib_off'){vibrateEnabled=false;saveGameSettings();return;}
  for(let _ai=0;_ai<4;_ai++){if(key==='set_accent_'+_ai){setAccent(_ai);return;}}
  if(key==='set_wipe'){wipeConfirm=true;SND.uiClick();return;}
  if(key==='set_wipe_no'){wipeConfirm=false;SND.uiClick();return;}
  if(key==='set_wipe_yes'){wipeConfirm=false;wipeSettingsData();return;}
  for(const a of['up','down','left','right','fire']){
    if(key==='set_bind_'+a){
      rebindAction=(rebindAction===a?null:a);SND.uiClick();return;
    }
  }
  if(key==='set_bind_reset'){bindings={...DEFAULT_BINDINGS};saveBindings();SND.uiClick();return;}
  if(key==='m_wipe'){wipeConfirm=true;SND.uiClick();return;}
  if(key==='m_wipe_no'){wipeConfirm=false;SND.uiClick();return;}
  if(key==='m_wipe_yes'){wipeConfirm=false;wipeProgressData();return;}
  if(key==='m_title'){
    const now=Date.now();
    if(now-titleTapTime>3000)titleTapCount=0;
    titleTapTime=now;titleTapCount++;
    if(titleTapCount>=7){
      titleTapCount=0;maxUnlocked=19;saveProgress(19);
      cheatMsg='★ ALL LEVELS UNLOCKED ★';cheatTimer=240;
    }
    return;
  }
  if(key==='m_arcade'){fadeToScreen(()=>{wipeConfirm=false;menuSel=0;startGame('arcade');});return;}
  if(key==='m_levels'){fadeToScreen(()=>{wipeConfirm=false;gameState='level_select';lsCursor=0;});return;}
  if(key==='m_support'){showSupport();return;}
  if(key==='g_signup'||key==='v_signup'){upgradeGuest();return;}
  if(key==='m_phone'){touchMode=!touchMode;return;}
  if(key==='ls_back'){fadeToScreen(()=>{gameState='menu';});return;}
  if(key.startsWith('ls_')){const i=parseInt(key.slice(3));if(i<=maxUnlocked){fadeToScreen(()=>startGame('levels',i));}return;}
  if(key==='p_resume'){_closePause(()=>{gameState='playing';clearTouch();});return;}
  if(key==='p_pmenu'){_closePause(()=>{globalFlushKills();gameState='menu';_uiFade=0;_uiDir=1;clearTouch();});return;}
  if(key==='g_retry'){fadeToScreen(()=>{startGame(gameMode,gameMode==='levels'?lvIdx:0);});return;}
  if(key==='g_gmenu'){fadeToScreen(()=>{gameState='menu';});return;}
  if(key==='v_retry'){fadeToScreen(()=>{startGame(gameMode,0);});return;}
  if(key==='v_vmenu'){fadeToScreen(()=>{gameState='menu';});return;}
}

// ── Canvas pos ────────────────────────────────────────────────────────────────
function canvasPos(cx,cy){
  const r=canvas.getBoundingClientRect();
  return{x:(cx-r.left)/scale,y:(cy-r.top)/scale};
}

// ── Pointer events ────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{
  initAudio();
  const{x,y}=canvasPos(e.clientX,e.clientY);
  if(gameState==='intro'){skipIntro();return;}
  if(gameState==='layout'){_layInputDown(x,y);return;}
  if(gameState==='settings'){
    const h=hitBtn(x,y);
    if(h==='set_vol_sl'){_setSlider='vol';_setSliderVal(x);return;}
    if(h==='set_sfx_sl'){_setSlider='sfx';_setSliderVal(x);return;}
    handleBtn(h);return;
  }
  if(gameState==='stats'){
    const h=hitBtn(x,y);
    if(h==='stats_back'||h==='stats_tab_arcade'||h==='stats_tab_overlord'){handleBtn(h);return;}
    if(x>GW/2&&y>143)_lbDrag={startY:y,startOff:_lbScrollY,moved:false};
    return;
  }
  if(gameState==='playing'){
    if(hitBtn(x,y)==='hud_pause'){gameState='paused';_openPause();clearTouch();return;}
    if(touchMode)touchDown(-1,x,y);
  }else{handleBtn(hitBtn(x,y));}
});
canvas.addEventListener('mouseup',e=>{
  _setSlider=null;touchUp(-1);
  if(gameState==='layout')_layInputUp();
  if(gameState==='stats'){if(_lbDrag&&!_lbDrag.moved)handleBtn(hitBtn(...Object.values(canvasPos(e.clientX,e.clientY))));_lbDrag=null;}
});
canvas.addEventListener('mousemove',e=>{
  if(e.buttons){
    const{x,y}=canvasPos(e.clientX,e.clientY);
    if(_setSlider){_setSliderVal(x);return;}
    if(gameState==='layout'){_layInputMove(x,y);return;}
    if(gameState==='stats'&&_lbDrag){
      const dy=_lbDrag.startY-y;
      if(Math.abs(dy)>6)_lbDrag.moved=true;
      if(_lbDrag.moved)_lbScrollY=Math.max(0,Math.min(_lbDrag.startOff+dy,_lbMaxScroll));
      return;
    }
    if(gameState==='playing'&&touchMode){touchMove(-1,x,y);}
  }
});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  for(const t of e.changedTouches){
    const{x,y}=canvasPos(t.clientX,t.clientY);
    if(gameState==='intro'){skipIntro();break;}
    if(gameState==='layout'){_layInputDown(x,y);break;}
    if(gameState==='settings'){
      const h=hitBtn(x,y);
      if(h==='set_vol_sl'){_setSlider='vol';_setSliderVal(x);break;}
      if(h==='set_sfx_sl'){_setSlider='sfx';_setSliderVal(x);break;}
      handleBtn(h);break;
    }
    if(gameState==='stats'){
      const h=hitBtn(x,y);
      if(h==='stats_back'||h==='stats_tab_arcade'||h==='stats_tab_overlord'){handleBtn(h);break;}
      if(x>GW/2&&y>143){_lbDrag={startY:y,startOff:_lbScrollY,moved:false};}
      break;
    }
    if(gameState==='playing'){
      if(hitBtn(x,y)==='hud_pause'){gameState='paused';clearTouch();break;}
      if(touchMode)touchDown(t.identifier,x,y);
    }else{handleBtn(hitBtn(x,y));}
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  _setSlider=null;
  for(const t of e.changedTouches){
    touchUp(t.identifier);
    if(gameState==='layout')_layInputUp();
    if(gameState==='stats')_lbDrag=null;
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const{x,y}=canvasPos(t.clientX,t.clientY);
    if(_setSlider){_setSliderVal(x);break;}
    if(gameState==='layout'){_layInputMove(x,y);break;}
    if(gameState==='stats'&&_lbDrag){
      const dy=_lbDrag.startY-y;
      if(Math.abs(dy)>6)_lbDrag.moved=true;
      if(_lbDrag.moved)_lbScrollY=Math.max(0,Math.min(_lbDrag.startOff+dy,_lbMaxScroll));
      break;
    }
    else touchMove(t.identifier,x,y);
  }
},{passive:false});
window.addEventListener('keydown',e=>{
  if(rebindAction!==null){
    if(e.code!=='Escape'&&e.code!=='F11'&&e.code!=='F5'){
      bindings[rebindAction]=e.code;saveBindings();SND.uiClick();
    }
    rebindAction=null;e.preventDefault();return;
  }
  if(gameState==='intro'){skipIntro();return;}
  if(e.code==='Escape'){
    if(gameState==='playing'){gameState='paused';_openPause();}
    else if(gameState==='paused'){_closePause(()=>{gameState='playing';clearTouch();});}
    else if(gameState==='level_select'){fadeToScreen(()=>{gameState='menu';});}
    else if(gameState==='settings'){fadeToScreen(()=>{rebindAction=null;wipeConfirm=false;gameState='menu';});}
    else if(gameState==='layout'){fadeToScreen(()=>{saveTouchLayout();gameState='settings';});}
    else if(gameState==='stats'){fadeToScreen(()=>{gameState='menu';});}
    else if(gameState==='game_over'||gameState==='victory'){fadeToScreen(()=>{gameState='menu';});}
  }
  if(e.key&&e.key.length===1){
    cheatBuf=(cheatBuf+e.key).slice(-10);
    if(cheatBuf.endsWith('lavelall')){
      cheatBuf='';maxUnlocked=19;saveProgress(19);
      cheatMsg='★ ALL LEVELS UNLOCKED ★';cheatTimer=240;
    }
  }
});

// ── Game loop (capped at 60 fps so speed is the same on 120 Hz screens) ───────
initStars();
let _lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-_lastTs<15.5)return;  // skip frame if less than ~1/64 s has passed
  _lastTs=ts;
  update();draw();
}
requestAnimationFrame(ts=>{_lastTs=ts;requestAnimationFrame(loop);});
</script>
