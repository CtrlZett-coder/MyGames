function resize(){
  const dpr=window.devicePixelRatio||1;
  const vw=window.innerWidth, vh=window.innerHeight;
  SC=Math.min(vw/GW, vh/GH);
  cv.style.width=(GW*SC)+'px';

  OX=(vw-GW*SC)/2; OY=(vh-GH*SC)/2;
  ctx.setTransform(SC*dpr,0,0,SC*dpr,0,0);
}
window.addEventListener('resize',resize);
resize();

function toLogical(clientX,clientY){ return {x:(clientX-OX)/SC, y:(clientY-OY)/SC}; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

{level:10,par:165,blocks:[{x:4,y:4,w:2,h:1,t:1},{x:1,y:4,w:1,h:4,t:0},{x:3,y:4,w:1,h:4,t:0},{x:2,y:3,w:1,h:4,t:0},{x:6,y:4,w:1,h:2,t:0},{x:5,y:5,w:1,h:3,t:0},{x:7,y:6,w:1,h:4,t:0},{x:4,y:2,w:1,h:2,t:0},{x:8,y:0,w:1,h:2,t:0},{x:9,y:4,w:1,h:2,t:0},{x:2,y:7,w:1,h:3,t:0},{x:0,y:8,w:2,h:1,t:0},{x:9,y:1,w:1,h:2,t:0},{x:2,y:0,w:1,h:3,t:0},{x:8,y:2,w:1,h:2,t:0},{x:4,y:5,w:1,h:4,t:0},{x:3,y:0,w:3,h:1,t:0},{x:5,y:3,w:2,h:1,t:0},{x:7,y:3,w:1,h:3,t:0},{x:0,y:0,w:1,h:4,t:0},{x:8,y:6,w:2,h:1,t:0},{x:6,y:7,w:1,h:3,t:0},{x:5,y:8,w:1,h:2,t:0},{x:5,y:2,w:3,h:1,t:0},{x:6,y:0,w:1,h:2,t:0},{x:3,y:1,w:1,h:3,t:0},{x:1,y:0,w:1,h:2,t:0},{x:8,y:7,w:1,h:2,t:0},{x:3,y:8,w:1,h:2,t:0}]},
];
const NLEVELS=LEVELS.length-1;
function blockColor(i){
  const hue=(i*47)%360;
  return 'hsl('+hue+',65%,58%)';
}

// ---------------- Game state ----------------
let state='menu'; // menu, play, complete
let B=null; // active board runtime
let activeButtons=[];

function cloneLevel(n){
  const lv=LEVELS[n];
  return {
    level:n, par:lv.par,
    blocks: lv.blocks.map(b=>({x:b.x,y:b.y,w:b.w,h:b.h,t:!!b.t,fx:b.x,fy:b.y})),
  };
}
function occupancyExcl(blocks, excl){
  const occ=new Array(COLS*ROWS).fill(-1);
  blocks.forEach((b,i)=>{
    if(i===excl) return;
    for(let dy=0;dy<b.h;dy++) for(let dx=0;dx<b.w;dx++){
      occ[(b.y+dy)*COLS+(b.x+dx)]=i;
    }
  });
  return occ;
}
function blockRange(blocks, idx){
  const b=blocks[idx];
  const occ=occupancyExcl(blocks, idx);
  const horiz = b.w>1;
  if(horiz){
    let minX=b.x, maxX=b.x;
    while(minX-1>=0 && occ[b.y*COLS+(minX-1)]===-1) minX--;
    while(maxX+b.w<COLS && occ[b.y*COLS+(maxX+b.w)]===-1) maxX++;
    return {axis:'x', min:minX, max:maxX};
  } else {
    let minY=b.y, maxY=b.y;
    while(minY-1>=0 && occ[(minY-1)*COLS+b.x]===-1) minY--;
    while(maxY+b.h<ROWS && occ[(maxY+b.h)*COLS+b.x]===-1) maxY++;
    return {axis:'y', min:minY, max:maxY};
  }
}
function isWon(){
  const t=B.blocks.find(b=>b.t);
  return t.x >= COLS-TARGET_LEN;
}

function startLevel(n){
  B=cloneLevel(n);
  B.moves=0;
  B.history=[];
  B.startTime=performance.now();
  B.won=false;
  B.winAnim=0;
  state='play';
}
function goMenu(){ state='menu'; B=null; }

function pushHistory(idx, fromX, fromY){
  B.history.push({idx, fromX, fromY});
  if(B.history.length>500) B.history.shift();
}
function undo(){
  if(!B || B.history.length===0 || B.won) return;
  const h=B.history.pop();
  const blk=B.blocks[h.idx];
  blk.x=h.fromX; blk.y=h.fromY; blk.fx=h.fromX; blk.fy=h.fromY;
  B.moves=Math.max(0,B.moves-1);
}
function restart(){
  if(!B) return;
  startLevel(B.level);
}
function completeLevel(){
  const n=B.level;
  const elapsed=(performance.now()-B.startTime)/1000;
  const ratio=B.moves/B.par;
  let stars=1;
  if(ratio<=1.15) stars=3; else if(ratio<=1.6) stars=2;
  const prevStars=save.stars[n]||0;
  if(stars>prevStars) save.stars[n]=stars;
  const prevBest=save.bestMoves[n];
  if(!prevBest || B.moves<prevBest) save.bestMoves[n]=B.moves;
  if(save.unlocked<n+1) save.unlocked=Math.min(NLEVELS,n+1);
  persist();
  B.elapsed=elapsed;
  B.starsEarned=stars;
  state='complete';
}

// ---------------- Input ----------------
let drag=null; // {idx, axis, startClient, startPos, min, max}
const pauseless=true;

function boardLayout(){
  const area={x:20,y:62,w:GW-40,h:GH-74};
  const CELL=Math.min(area.w/COLS, area.h/ROWS);
  const bw=CELL*COLS, bh=CELL*ROWS;
  const ox=area.x+(area.w-bw)/2, oy=area.y+(area.h-bh)/2;
  return {CELL,ox,oy};
}
function pickBlockAt(lx,ly){
  const {CELL,ox,oy}=boardLayout();
  const gx=(lx-ox)/CELL, gy=(ly-oy)/CELL;
  if(gx<0||gx>=COLS||gy<0||gy>=ROWS) return -1;
  for(let i=0;i<B.blocks.length;i++){
    const b=B.blocks[i];
    if(gx>=b.x-0.02 && gx<=b.x+b.w+0.02 && gy>=b.y-0.02 && gy<=b.y+b.h+0.02) return i;
  }
  return -1;
}

function pointerDown(id, lx, ly){
  for(const btn of activeButtons){
    if(lx>=btn.x&&lx<=btn.x+btn.w&&ly>=btn.y&&ly<=btn.y+btn.h){ btn.action(); return; }
  }
  if(state!=='play' || B.won) return;
  const idx=pickBlockAt(lx,ly);
  if(idx<0) return;
  const r=blockRange(B.blocks, idx);
  const b=B.blocks[idx];
  drag={
    id, idx, axis:r.axis, min:r.min, max:r.max,
    startLX:lx, startLY:ly,
    startPos: r.axis==='x'?b.x:b.y,
  };
}
function pointerMoveH(id, lx, ly){
  if(!drag || drag.id!==id) return;
  const {CELL}=boardLayout();
  const b=B.blocks[drag.idx];
  if(drag.axis==='x'){
    const deltaCells=(lx-drag.startLX)/CELL;
    const p=clamp(drag.startPos+deltaCells, drag.min, drag.max);
    b.fx=p; b.x=Math.round(p);
  } else {
    const deltaCells=(ly-drag.startLY)/CELL;
    const p=clamp(drag.startPos+deltaCells, drag.min, drag.max);
    b.fy=p; b.y=Math.round(p);
  }
}
function pointerUpH(id){
  if(!drag || drag.id!==id) return;
  const b=B.blocks[drag.idx];
  if(drag.axis==='x'){
    const snapped=clamp(Math.round(b.fx), drag.min, drag.max);
    if(snapped!==drag.startPos){ pushHistory(drag.idx, drag.startPos, b.y); B.moves++; }
    b.x=snapped; b.fx=snapped;
  } else {
    const snapped=clamp(Math.round(b.fy), drag.min, drag.max);
    if(snapped!==drag.startPos){ pushHistory(drag.idx, b.x, drag.startPos); B.moves++; }
    b.y=snapped; b.fy=snapped;
  }
  drag=null;
  if(isWon() && !B.won){ B.won=true; B.winAnim=0; }
}

cv.addEventListener('pointerdown',e=>{
  const p=toLogical(e.clientX,e.clientY);
  pointerDown(e.pointerId,p.x,p.y);
  e.preventDefault();
},{passive:false});
cv.addEventListener('pointermove',e=>{
  const p=toLogical(e.clientX,e.clientY);
  pointerMoveH(e.pointerId,p.x,p.y);
  e.preventDefault();
},{passive:false});
cv.addEventListener('pointerup',e=>{ pointerUpH(e.pointerId); e.preventDefault(); },{passive:false});
cv.addEventListener('pointercancel',e=>{ pointerUpH(e.pointerId); },{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  if(e.code==='KeyZ' && (e.ctrlKey||e.metaKey)) undo();
  if(e.code==='KeyR') restart();
});

// ---------------- Drawing helpers ----------------
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawButton(x,y,w,h,label){
  ctx.fillStyle='rgba(20,30,50,0.9)';
  ctx.strokeStyle='#2ee6ff';
  ctx.lineWidth=2;
  roundRect(x,y,w,h,10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#eaf6ff';
  ctx.font='bold 19px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, x+w/2, y+h/2);
}
function drawStars(cx,cy,r,count,total){
  const w=r*2.4;
  const startX=cx-((total-1)*w)/2;
  for(let i=0;i<total;i++){
    drawStar(startX+i*w, cy, r, i<count);
  }
}
function drawStar(cx,cy,r,filled){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=-Math.PI/2 + i*(Math.PI*2/5);
    const a2=a+Math.PI/5;
    ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    ctx.lineTo(cx+Math.cos(a2)*r*0.42, cy+Math.sin(a2)*r*0.42);
  }
  ctx.closePath();
  ctx.fillStyle = filled ? '#ffd23f' : 'rgba(255,255,255,0.15)';
  ctx.fill();
  if(filled){ ctx.strokeStyle='#ffb000'; ctx.lineWidth=1; ctx.stroke(); }
}

// ---------------- Render ----------------
function render(){
  ctx.clearRect(0,0,GW,GH);
  const grad=ctx.createLinearGradient(0,0,0,GH);
  grad.addColorStop(0,'#0a0e1a'); grad.addColorStop(1,'#05060a');
  ctx.fillStyle=grad; ctx.fillRect(0,0,GW,GH);

  if(state==='menu') renderMenu();
  else if(state==='play') renderPlay();
  else if(state==='complete') renderComplete();
}

function renderMenu(){
  activeButtons=[];
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#2ee6ff';
  ctx.font='bold 46px sans-serif';
  ctx.shadowColor='#2ee6ff'; ctx.shadowBlur=18;
  ctx.fillText('ПОБЕГ', GW/2, 78);
  ctx.shadowBlur=0;
  ctx.font='15px sans-serif';
  ctx.fillStyle='#8fa3c0';
  ctx.fillText('Сдвигай блоки и выведи розовый блок к выходу', GW/2, 104);

  const cols=5, rows=2, bw=130, bh=100, gap=16;
  const gridW=cols*bw+(cols-1)*gap;
  const startX=(GW-gridW)/2, startY=140;
  for(let n=1;n<=NLEVELS;n++){
    const ci=(n-1)%cols, ri=Math.floor((n-1)/cols);
    const x=startX+ci*(bw+gap), y=startY+ri*(bh+gap);
    const unlocked = n<=save.unlocked;
    ctx.fillStyle = unlocked ? 'rgba(20,40,60,0.9)' : 'rgba(15,15,20,0.85)';
    ctx.strokeStyle = unlocked ? '#2ee6ff' : '#333';
    ctx.lineWidth=2;
    roundRect(x,y,bw,bh,12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = unlocked ? '#eaf6ff' : '#555';
    ctx.font='bold 26px sans-serif';
    ctx.textBaseline='middle'; ctx.textAlign='center';
    ctx.fillText(unlocked?String(n):'🔒', x+bw/2, y+30);
    if(unlocked){
      const st=save.stars[n]||0;
      drawStars(x+bw/2, y+58, 8, st, 3);
      ctx.font='11px sans-serif';
      ctx.fillStyle='#8fd6ff';
      const bm=save.bestMoves[n];
      ctx.fillText(bm?('★ '+bm+' ход.'):'—', x+bw/2, y+82);
      activeButtons.push({x,y,w:bw,h:bh,action:()=>startLevel(n)});
    } else {
      ctx.font='11px sans-serif';
      ctx.fillStyle='#444';
      ctx.fillText('заблокирован', x+bw/2, y+70);
    }
  }
  ctx.font='13px sans-serif';
  ctx.fillStyle='#5a6b85';
  ctx.fillText('Перетаскивай блоки мышью/пальцем вдоль их оси. Ctrl+Z — отменить, R — заново.', GW/2, startY+rows*(bh+gap)+16);
}

function renderPlay(){
  const {CELL,ox,oy}=boardLayout();
  const S=(gx,gy)=>({x:ox+gx*CELL, y:oy+gy*CELL});

  // board background
  ctx.fillStyle='#0c1220';
  roundRect(ox,oy,CELL*COLS,CELL*ROWS,10);
  ctx.fill();

  // grid lines
  ctx.strokeStyle='rgba(46,230,255,0.15)';
  ctx.lineWidth=1;
  for(let i=1;i<COLS;i++){
    ctx.beginPath(); ctx.moveTo(ox+i*CELL,oy); ctx.lineTo(ox+i*CELL,oy+CELL*ROWS); ctx.stroke();
  }
  for(let j=1;j<ROWS;j++){
    ctx.beginPath(); ctx.moveTo(ox,oy+j*CELL); ctx.lineTo(ox+CELL*COLS,oy+j*CELL); ctx.stroke();
  }

  // board border with exit notch
  ctx.strokeStyle='#2ee6ff';
  ctx.shadowColor='#2ee6ff'; ctx.shadowBlur=8;
  ctx.lineWidth=Math.max(2,CELL*0.07);
  ctx.beginPath();
  ctx.moveTo(ox,oy); ctx.lineTo(ox+CELL*COLS,oy);
  ctx.lineTo(ox+CELL*COLS,oy+TARGET_ROW*CELL);
  ctx.moveTo(ox+CELL*COLS,oy+(TARGET_ROW+1)*CELL);
  ctx.lineTo(ox+CELL*COLS,oy+CELL*ROWS);
  ctx.lineTo(ox,oy+CELL*ROWS);
  ctx.lineTo(ox,oy);
  ctx.stroke();
  // exit glow
  ctx.fillStyle='rgba(63,255,140,0.75)';
  ctx.shadowColor='#3fff8c'; ctx.shadowBlur=16;
  ctx.fillRect(ox+CELL*COLS-2, oy+TARGET_ROW*CELL, CELL*0.35, CELL);
  ctx.shadowBlur=0;

  // blocks
  const pad=CELL*0.07;
  for(const b of B.blocks){
    const px=ox+(b.fx!==undefined?b.fx:b.x)*CELL, py=oy+(b.fy!==undefined?b.fy:b.y)*CELL;
    const w=b.w*CELL, h=b.h*CELL;
    const idx=B.blocks.indexOf(b);
    const color = b.t ? '#ff4d8f' : blockColor(idx);
    ctx.fillStyle=color;
    ctx.shadowColor=color; ctx.shadowBlur=b.t?14:6;
    roundRect(px+pad,py+pad,w-2*pad,h-2*pad, CELL*0.18);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,0.25)';
    ctx.lineWidth=1.5;
    roundRect(px+pad,py+pad,w-2*pad,h-2*pad, CELL*0.18);
    ctx.stroke();

    // direction chevrons at both ends along axis
    ctx.fillStyle='rgba(255,255,255,0.55)';
    if(b.w>1){
      drawChevron(px+pad+6, py+h/2, -1, CELL*0.12);
      drawChevron(px+w-pad-6, py+h/2, 1, CELL*0.12);
    } else {
      drawChevron(px+w/2, py+pad+6, -1, CELL*0.12, true);
      drawChevron(px+w/2, py+h-pad-6, 1, CELL*0.12, true);
    }

    // face on target block
    if(b.t){
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(px+w*0.34, py+h*0.5, CELL*0.11, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#1a1a2a';
      ctx.beginPath(); ctx.arc(px+w*0.34, py+h*0.5, CELL*0.05, 0, Math.PI*2); ctx.fill();
    }
  }

  renderHUD();

  if(B.won){
    B.winAnim+=1/60;
    if(B.winAnim>0.5) completeLevel();
  }
}
function drawChevron(cx,cy,dir,size,vertical){
  ctx.beginPath();
  if(vertical){
    ctx.moveTo(cx-size*0.6, cy-dir*size*0.5);
    ctx.lineTo(cx+size*0.6, cy-dir*size*0.5);
    ctx.lineTo(cx, cy+dir*size*0.5);
  } else {
    ctx.moveTo(cx-dir*size*0.5, cy-size*0.6);
    ctx.lineTo(cx-dir*size*0.5, cy+size*0.6);
    ctx.lineTo(cx+dir*size*0.5, cy);
  }
  ctx.closePath();
  ctx.fill();
}

function renderHUD(){
  activeButtons=activeButtons.filter(()=>false);
  ctx.fillStyle='rgba(6,10,20,0.85)';
  ctx.fillRect(0,0,GW,54);
  ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.fillStyle='#8fd6ff';
  ctx.font='bold 17px sans-serif';
  ctx.fillText('УРОВЕНЬ '+B.level+'/'+NLEVELS, 16, 27);

  ctx.textAlign='center';
  ctx.fillStyle='#eaf6ff';
  ctx.font='bold 18px sans-serif';
  ctx.fillText('Ходы: '+B.moves+'  (пар '+B.par+')', GW/2, 27);

  const bw=90,bh=34,gap=10;
  let bx=GW-16-bw;
  drawButton(bx,10,bw,bh,'Меню');
  activeButtons.push({x:bx,y:10,w:bw,h:bh,action:goMenu});
  bx-=bw+gap;
  drawButton(bx,10,bw,bh,'Заново');
  activeButtons.push({x:bx,y:10,w:bw,h:bh,action:restart});
  bx-=bw+gap;
  drawButton(bx,10,bw,bh,'Отмена');
  activeButtons.push({x:bx,y:10,w:bw,h:bh,action:undo});
}

function renderComplete(){
  activeButtons=[];
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#3fff8c';
  ctx.font='bold 40px sans-serif';
  ctx.shadowColor='#3fff8c'; ctx.shadowBlur=16;
  ctx.fillText('УРОВЕНЬ ПРОЙДЕН!', GW/2, GH/2-130);
  ctx.shadowBlur=0;

  drawStars(GW/2, GH/2-80, 20, B.starsEarned, 3);

  ctx.font='18px sans-serif';
  ctx.fillStyle='#cfe';
  ctx.fillText('Ходов: '+B.moves+' (оптимально: '+B.par+')', GW/2, GH/2-30);
  ctx.fillText('Время: '+B.elapsed.toFixed(1)+' сек', GW/2, GH/2);

  const bw=220,bh=54;
  const bx=GW/2-bw/2;
  const n=B.level;
  if(n<NLEVELS){
    drawButton(bx,GH/2+30,bw,bh,'Следующий уровень');
    activeButtons.push({x:bx,y:GH/2+30,w:bw,h:bh,action:()=>startLevel(n+1)});
  } else {
    drawButton(bx,GH/2+30,bw,bh,'Все уровни пройдены!');
    activeButtons.push({x:bx,y:GH/2+30,w:bw,h:bh,action:goMenu});
  }
  drawButton(bx,GH/2+96,bw,bh,'В меню');
  activeButtons.push({x:bx,y:GH/2+96,w:bw,h:bh,action:goMenu});
}

// ---------------- Main loop ----------------
function frame(){
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
