function resize(){
  SC=Math.min(innerWidth/GW,innerHeight/GH);
  cv.width=innerWidth;cv.height=innerHeight;
  OX=(innerWidth-GW*SC)/2;OY=(innerHeight-GH*SC)/2;
}
resize();window.addEventListener('resize',resize);

function gctx(fn){ctx.save();ctx.translate(OX,OY);ctx.scale(SC,SC);try{fn();}finally{ctx.restore();}}

// ── Audio ─────────────────────────────────────────────────────────────────────
let actx=null,masterGain=null;
function initAudio(){
  if(actx)return;
  try{
    actx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=actx.createGain();masterGain.gain.value=0.7;
    masterGain.connect(actx.destination);
  }catch(e){}
}
function playTone(f,dur,vol=0.35,type='sine'){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
  o.connect(g);g.connect(masterGain);
  o.start();o.stop(actx.currentTime+dur);
}
function playNoise(dur,vol=0.35){
  if(!actx)return;
  const buf=actx.createBuffer(1,Math.floor(actx.sampleRate*dur),actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=actx.createBufferSource(),g=actx.createGain();
  s.buffer=buf;
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
  s.connect(g);g.connect(masterGain);
  s.start();s.stop(actx.currentTime+dur);
}

window.addEventListener('keydown',e=>{
  KB[e.code]=true;
  if(e.code==='Escape'){
    if(gameState==='play')gameState='menu';
    else if(gameState==='help'||gameState==='gameover'||gameState==='victory')gameState='menu';
  }
  if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&gameState==='play'){
    ball.jbuf=JBUF; e.preventDefault();
  }
  if(e.code==='Space')e.preventDefault();
});

// ── Touch ─────────────────────────────────────────────────────────────────────
let touchL=false,touchR=false,touchJ=false;
let touchIds={L:-1,R:-1,J:-1};

function touchToGame(tx,ty){return{x:(tx-OX)/SC,y:(ty-OY)/SC};}
function isTouchL(gx,gy){return gx<GW*0.25&&gy>GH*0.55;}
function isTouchR(gx,gy){return gx>=GW*0.25&&gx<GW*0.55&&gy>GH*0.55;}
function isTouchJ(gx,gy){return gx>=GW*0.55&&gy>GH*0.55;}

cv.addEventListener('touchstart',e=>{
  initAudio();
  for(const t of e.changedTouches){
    const {x,y}=touchToGame(t.clientX,t.clientY);
    if(gameState!=='play'){handleClick(x,y);continue;}
    if(isTouchL(x,y))  {touchL=true; touchIds.L=t.identifier;}
    else if(isTouchR(x,y)){touchR=true; touchIds.R=t.identifier;}
    else if(isTouchJ(x,y)){touchJ=true; touchIds.J=t.identifier; ball.jbuf=JBUF;}
  }
  e.preventDefault();
},{passive:false});

cv.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===touchIds.L){touchL=false;touchIds.L=-1;}
    if(t.identifier===touchIds.R){touchR=false;touchIds.R=-1;}
    if(t.identifier===touchIds.J){touchJ=false;touchIds.J=-1;}
  }
},{passive:false});

cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
cv.addEventListener('mousedown',e=>{
  initAudio();
  const {x,y}=touchToGame(e.clientX,e.clientY);
  if(gameState!=='play') handleClick(x,y);
});
cv.addEventListener('mousemove',e=>{
  const {x,y}=touchToGame(e.clientX,e.clientY);
  hoverBtn='';
  for(const[k,r]of Object.entries(btnRects))
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){hoverBtn=k;break;}
});

function handleClick(x,y){
  for(const[k,r]of Object.entries(btnRects)){
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){SND.click();btnAction(k);return;}
  }
}

function btnAction(k){
  if(k==='play'){lv=0;lives=3;score=0;loadLevel(0);gameState='play';}
  else if(k==='help')gameState='help';
  else if(k==='back')gameState='menu';
  else if(k==='retry'){lives=3;score=0;loadLevel(lv);gameState='play';}
  else if(k==='menu')gameState='menu';
}

// ── Load level ────────────────────────────────────────────────────────────────
function loadLevel(idx){
  const ld=LEVELS[idx];
  plats=ld.plats;
  mplats=ld.mplats.map(m=>({...m,x:m.ox,y:m.oy,vx:0,vy:0,t:0}));
  enemies=ld.enemies.map(e=>({...e,x:e.sx,alive:true,dt:0,wt:0,dir:1}));
  stars=ld.stars.map(s=>({...s,alive:true,t:Math.random()*Math.PI*2}));
  spikes=ld.spikes;
  flagPos={x:ld.flag[0],y:ld.flag[1]};
  ball={x:ld.start[0],y:ld.start[1],vx:0,vy:0,angle:0,onGnd:false,coyote:0,jbuf:0,squash:1,squashV:0};
  camX=0;camTarget=0;
  particles=[];
  starsGot=0;
  lvDone=false;lvDoneTimer=0;
  flashT=0;
}
loadLevel(0);

// ── Spike collision rects ─────────────────────────────────────────────────────
function getSpikeRects(){
  const TW=24,rects=[];
  for(const s of spikes)
    for(let i=0;i<s.n;i++)
      rects.push({x:s.x+i*TW,y:s.y-18,w:TW,h:18});
  return rects;
}

// ── Physics update ────────────────────────────────────────────────────────────
function updateBall(){
  const left=(KB.ArrowLeft||KB.KeyA||touchL);
  const right=(KB.ArrowRight||KB.KeyD||touchR);

  if(left)  ball.vx-=HACC;
  else if(right)ball.vx+=HACC;
  else ball.vx*=FRIC;
  ball.vx=clamp(ball.vx,-MAXHS,MAXHS);

  // Coyote
  if(ball.onGnd)ball.coyote=COYOTE;else ball.coyote=Math.max(0,ball.coyote-1);
  if(ball.jbuf>0)ball.jbuf--;

  // Jump
  if(ball.jbuf>0&&ball.coyote>0){
    ball.vy=JUMPV;ball.coyote=0;ball.jbuf=0;SND.jump();
  }

  ball.vy=Math.min(ball.vy+GRAV,MAXFALL);

  // Move X
  ball.x+=ball.vx;
  // Resolve X vs static plats
  for(const p of plats){
    const bx=ball.x-BR,by=ball.y-BR;
    if(!overlap(bx,by,BR*2,BR*2,p.x,p.y,p.w,p.h))continue;
    if(ball.vx>0)ball.x=p.x-BR;
    else ball.x=p.x+p.w+BR;
    ball.vx=0;
  }

  // Move Y
  ball.y+=ball.vy;
  ball.onGnd=false;
  // Resolve Y vs static plats
  for(const p of plats){
    const bx=ball.x-BR,by=ball.y-BR;
    if(!overlap(bx,by,BR*2,BR*2,p.x,p.y,p.w,p.h))continue;
    if(ball.vy>=0){
      ball.y=p.y-BR;ball.vy=0;ball.onGnd=true;
      if(ball.squash>1.0){ball.squash=0.62;ball.squashV=0.055;}
    }else{ball.y=p.y+p.h+BR;ball.vy=0;}
  }

  // Moving platforms
  for(const m of mplats){
    const bx=ball.x-BR,by=ball.y-BR;
    if(!overlap(bx,by,BR*2,BR*2,m.x,m.y,m.w,m.h))continue;
    // Standing on top
    if(ball.vy>=0&&ball.y<m.y+m.h/2){
      ball.y=m.y-BR;ball.vy=0;ball.onGnd=true;
      ball.x+=m.vx;ball.y+=m.vy;
      if(ball.squash>1.0){ball.squash=0.62;ball.squashV=0.055;}
    }else if(ball.vy<0){
      ball.y=m.y+m.h+BR;ball.vy=0;
    }else if(ball.vx>0){
      ball.x=m.x-BR;ball.vx=0;
    }else{
      ball.x=m.x+m.w+BR;ball.vx=0;
    }
  }

  // Rolling & squash
  ball.angle+=ball.vx*1.8;
  ball.squash+=ball.squashV;ball.squashV*=0.72;
  if(Math.abs(ball.squash-1)<0.01&&Math.abs(ball.squashV)<0.002){ball.squash=1;ball.squashV=0;}
  ball.squash=clamp(ball.squash,0.55,1.45);
}

function updateMPlats(){
  for(const m of mplats){
    const px=m.x,py=m.y;
    m.t+=0.025;
    m.x=m.ox+(m.dx?Math.sin(m.t*m.dx)*m.range/2:0);
    m.y=m.oy+(m.dy?Math.sin(m.t*m.dy)*m.range/2:0);
    m.vx=m.x-px;m.vy=m.y-py;
  }
}

function spawnParticles(x,y,col,n=12){
  for(let i=0;i<n;i++)particles.push({
    x:x+Math.random()*16-8,y:y+Math.random()*16-8,
    vx:Math.random()*6-3,vy:Math.random()*-5-1,
    col,r:3+Math.random()*5,life:20+Math.random()*15,maxLife:35
  });
}

function dieBall(){
  if(flashT>0)return;
  flashT=22;lives--;
  spawnParticles(ball.x,ball.y,'#de2424',16);
  SND.die();
  if(lives<=0)gameState='gameover';
  else{
    const ld=LEVELS[lv];
    ball={x:ld.start[0],y:ld.start[1],vx:0,vy:0,angle:0,onGnd:false,coyote:0,jbuf:0,squash:1,squashV:0};
    camX=0;
  }
}

function updatePlay(){
  updateMPlats();
  updateBall();

  // Stars
  for(const s of stars){
    s.t+=0.06;
    if(!s.alive)continue;
    if(overlap(ball.x-BR,ball.y-BR,BR*2,BR*2,s.x-12,s.y-12,24,24)){
      s.alive=false;starsGot++;score+=100;
      spawnParticles(s.x,s.y,'#ffd700',8);SND.star();
    }
  }

  // Enemies
  for(const e of enemies){
    if(!e.alive){if(e.dt>0)e.dt--;continue;}
    e.x+=e.spd*e.dir;e.wt+=e.spd;
    if(Math.abs(e.x-e.sx)>e.range/2)e.dir*=-1;
    // Collision with ball
    const ex=e.x-e.w/2,ey=e.y-e.h;
    if(!overlap(ball.x-BR,ball.y-BR,BR*2,BR*2,ex,ey,e.w,e.h))continue;
    // Stomp check
    if(ball.vy>0&&(ball.y+BR)<e.y-e.h/2+8){
      e.alive=false;e.dt=14;
      ball.vy=JUMPV*0.65;score+=200;
      spawnParticles(e.x,e.y-e.h/2,'#363240',12);SND.stomp();
    }else dieBall();
    return;
  }

  // Spikes
  for(const sr of getSpikeRects()){
    if(overlap(ball.x-BR,ball.y-BR,BR*2,BR*2,sr.x,sr.y,sr.w,sr.h)){dieBall();return;}
  }

  // Fall off
  if(ball.y>GH+80){dieBall();return;}

  // Flag
  if(overlap(ball.x-BR,ball.y-BR,BR*2,BR*2,flagPos.x-20,flagPos.y-60,40,60)&&!lvDone){
    lvDone=true;lvDoneTimer=90;
    const bonus=starsGot*50+500;score+=bonus;
    if(score>hiScore){hiScore=score;try{localStorage.setItem('rb_hi',hiScore);}catch(e){}}
    SND.win();
  }
  if(lvDone){
    lvDoneTimer--;
    if(lvDoneTimer<=0){
      if(lv+1<LEVELS.length){lv++;loadLevel(lv);}
      else gameState='victory';
    }
  }

  // Camera
  camTarget=clamp(ball.x-GW*0.35,0,LEVELS[lv].ww-GW);
  camX+=(camTarget-camX)*0.12;

  // Particles
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;}
  particles=particles.filter(p=>p.life>0);

  if(flashT>0)flashT--;
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawSky(bg){
  const top=bg.map(c=>Math.max(0,c-45));
  const g=ctx.createLinearGradient(0,0,0,GH);
  g.addColorStop(0,`rgb(${top})`);g.addColorStop(1,`rgb(${bg})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,GW,GH);
}

function drawPlats(){
  for(const p of plats){
    const px=p.x-camX;
    if(px>GW||px+p.w<0)continue;
    ctx.fillStyle='#623e20';ctx.fillRect(px,p.y,p.w,p.h);
    ctx.fillStyle='#4e9438';ctx.fillRect(px,p.y,p.w,14);
    ctx.fillStyle='#3c8230';ctx.fillRect(px,p.y,p.w,6);
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(px,p.y,p.w,p.h);
  }
}

function drawMPlats(){
  for(const m of mplats){
    const mx=m.x-camX;
    if(mx>GW||mx+m.w<0)continue;
    ctx.fillStyle='#c88c3a';roundRect(mx,m.y,m.w,m.h,5);ctx.fill();
    ctx.strokeStyle='#9e6c26';ctx.lineWidth=2;ctx.stroke();
    // Arrow
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.beginPath();ctx.moveTo(mx+m.w/2-8,m.y+m.h/2+4);
    ctx.lineTo(mx+m.w/2+8,m.y+m.h/2+4);ctx.lineTo(mx+m.w/2,m.y+m.h/2-5);
    ctx.closePath();ctx.fill();
  }
}

function drawSpikes(){
  const TW=24;
  for(const s of spikes){
    for(let i=0;i<s.n;i++){
      const sx=s.x+i*TW-camX;
      ctx.fillStyle='#b2b2bc';
      ctx.beginPath();ctx.moveTo(sx,s.y);ctx.lineTo(sx+TW,s.y);ctx.lineTo(sx+TW/2,s.y-22);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.stroke();
    }
  }
}

function drawStars(){
  for(const s of stars){
    if(!s.alive)continue;
    const x=s.x-camX,y=s.y+Math.sin(s.t)*4;
    const r=10+Math.sin(s.t*2)*1.5;
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=(i*36-90)*Math.PI/180;
      const rd=i%2===0?r:r/2.5;
      i===0?ctx.moveTo(x+Math.cos(a)*rd,y+Math.sin(a)*rd)
           :ctx.lineTo(x+Math.cos(a)*rd,y+Math.sin(a)*rd);
    }
    ctx.closePath();ctx.fillStyle='#ffd700';ctx.fill();
    ctx.strokeStyle='#ffa800';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill();
  }
}

function drawEnemies(){
  for(const e of enemies){
    if(!e.alive&&e.dt<=0)continue;
    const x=e.x-camX,y=e.y,w=e.w,h=e.h;
    ctx.fillStyle='#181216';
    roundRect(x-w/2,y-h,w,h,4);ctx.fill();
    ctx.strokeStyle='#363240';ctx.lineWidth=2;ctx.stroke();
    // Eyes
    const ey=y-h+12;
    for(const ex of[x-10,x+5]){
      ctx.fillStyle='white';ctx.beginPath();ctx.arc(ex,ey,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#181216';ctx.beginPath();ctx.arc(ex+e.dir*2,ey+2,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c83030';ctx.beginPath();ctx.arc(ex+e.dir*2,ey+2,2,0,Math.PI*2);ctx.fill();
    }
    // Legs
    const lt=Math.sin(e.wt*0.25);
    ctx.strokeStyle='#363240';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x-8+lt*6,y+8);
    ctx.moveTo(x+8,y);ctx.lineTo(x+8-lt*6,y+8);ctx.stroke();
  }
}

function drawFlag(){
  const x=flagPos.x-camX,y=flagPos.y;
  ctx.fillStyle='#583018';ctx.fillRect(x-3,y-80,6,80);
  ctx.beginPath();ctx.moveTo(x+3,y-80);
  for(let i=0;i<8;i++)ctx.lineTo(x+3+i*5,y-80+Math.sin(gameT*0.05+i*0.5)*5);
  ctx.lineTo(x+3,y-60);ctx.closePath();
  ctx.fillStyle='#ff5600';ctx.fill();
  ctx.fillStyle='#583018';ctx.beginPath();ctx.ellipse(x,y-4,14,5,0,0,Math.PI*2);ctx.fill();
}

function drawBall(){
  const x=ball.x-camX,y=ball.y;
  const sq=ball.squash;
  const rw=Math.max(4,BR/sq),rh=Math.max(4,BR*sq);

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath();ctx.ellipse(x,y+rh-2,rw*0.9,5,0,0,Math.PI*2);ctx.fill();

  ctx.save();ctx.translate(x,y);
  // Body
  ctx.beginPath();ctx.ellipse(0,0,rw,rh,0,0,Math.PI*2);
  ctx.fillStyle='#de2424';ctx.fill();
  ctx.strokeStyle='#9e0e0e';ctx.lineWidth=3;ctx.stroke();
  // Rotation stripe
  const a=ball.angle*Math.PI/180;
  ctx.strokeStyle='#9e0e0e';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*(rw-4),Math.sin(a)*(rh-4));ctx.stroke();
  // Highlight
  ctx.fillStyle='rgba(255,120,120,0.65)';
  ctx.beginPath();ctx.ellipse(-rw*0.28,-rh*0.32,rw*0.22,rh*0.18,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x-camX,p.y,Math.max(1,p.r*a),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  ctx.font='bold 18px monospace';
  ctx.fillStyle='#de2424';ctx.fillText('❤ '+lives,12,24);
  ctx.fillStyle='white';ctx.fillText('Score: '+score,12,46);
  ctx.fillStyle='#ffd700';ctx.fillText('★ '+starsGot+'/'+stars.length,12,68);
  ctx.fillStyle='#0cc8ff';ctx.textAlign='center';
  ctx.fillText('Lv '+(lv+1)+': '+LEVELS[lv].name,GW/2,22);
  ctx.textAlign='left';
  ctx.fillStyle='#888';ctx.font='13px monospace';ctx.fillText('Best: '+hiScore,GW-90,20);
  ctx.textAlign='left';
}

function drawTouchControls(){
  // Only show on touch devices (has touchstart capability)
  const R=44;
  const btns=[
    {x:70,y:GH-70,lbl:'←',id:'L',active:touchL},
    {x:190,y:GH-70,lbl:'→',id:'R',active:touchR},
    {x:GW-70,y:GH-70,lbl:'↑',id:'J',active:touchJ},
  ];
  for(const b of btns){
    ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);
    ctx.fillStyle=b.active?'rgba(222,36,36,0.65)':'rgba(255,255,255,0.15)';ctx.fill();
    ctx.strokeStyle=b.active?'#ff6666':'rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=b.active?'white':'rgba(255,255,255,0.7)';
    ctx.font='bold 24px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.lbl,b.x,b.y);
  }
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
}

function drawPlay(){
  const ld=LEVELS[lv];
  drawSky(ld.bg);
  drawPlats();drawMPlats();drawSpikes();drawStars();drawEnemies();drawFlag();drawParticles();drawBall();
  // Flash
  if(flashT>0){
    ctx.fillStyle=rgba(255,60,60,Math.min(0.7,flashT*0.035));
    ctx.fillRect(0,0,GW,GH);
  }
  drawHUD();
  drawTouchControls();
  // Level done banner
  if(lvDone){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,GH/2-45,GW,90);
    ctx.fillStyle='#ffd700';ctx.font='bold 28px monospace';ctx.textAlign='center';
    const nextName=lv+1<LEVELS.length?LEVELS[lv+1].name:'';
    ctx.fillText(lv+1<LEVELS.length?'Level '+(lv+1)+' Complete!':'All Levels Done!',GW/2,GH/2-10);
    ctx.fillStyle='white';ctx.font='18px monospace';
    ctx.fillText(nextName?'Next: '+nextName:'You Win!',GW/2,GH/2+20);
    ctx.textAlign='left';
  }
}

// ── Menu ──────────────────────────────────────────────────────────────────────
let menuStars=[];
for(let i=0;i<60;i++)menuStars.push({x:Math.random()*GW,y:Math.random()*GH,s:Math.random()*2+0.5,sp:Math.random()*0.4+0.1});

function drawMenu(){
  ctx.fillStyle='#0a0c14';ctx.fillRect(0,0,GW,GH);
  // Stars background
  for(const s of menuStars){
    s.y=(s.y+s.sp)%GH;
    ctx.fillStyle=`rgba(200,200,230,${0.4+s.s*0.2})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s*0.7,0,Math.PI*2);ctx.fill();
  }
  // Title
  ctx.textAlign='center';
  ctx.fillStyle='#de2424';ctx.font='bold 72px monospace';
  ctx.shadowColor='#de2424';ctx.shadowBlur=20;ctx.fillText('RED',GW/2,170);
  ctx.shadowBlur=0;
  ctx.fillStyle='white';ctx.font='bold 52px monospace';ctx.fillText('BALL',GW/2,230);
  ctx.fillStyle='#ffd700';ctx.font='18px monospace';ctx.fillText('Rolling Adventure',GW/2,268);

  // Bouncing demo ball
  const bt=gameT*0.04;
  const bdy=GH/2-50+Math.abs(Math.sin(bt*1.4))*-50+50;
  ctx.save();ctx.translate(GW/2,bdy);
  const ba=bt*70*Math.PI/180;
  ctx.beginPath();ctx.arc(0,0,BR,0,Math.PI*2);ctx.fillStyle='#de2424';ctx.fill();
  ctx.strokeStyle='#9e0e0e';ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle='#9e0e0e';ctx.beginPath();ctx.moveTo(0,0);
  ctx.lineTo(Math.cos(ba)*(BR-4),Math.sin(ba)*(BR-4));ctx.stroke();
  ctx.restore();
  // Ball shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.ellipse(GW/2,GH/2+8,BR*0.9,5,0,0,Math.PI*2);ctx.fill();

  btnRects={};
  const btns=[['PLAY','play'],['CONTROLS','help']];
  btns.forEach(([lbl,k],i)=>{
    const bw=200,bh=48,bx=GW/2-bw/2,by=360+i*64;
    btnRects[k]={x:bx,y:by,w:bw,h:bh};
    const hov=hoverBtn===k;
    ctx.fillStyle=hov?'rgba(180,20,20,0.9)':'rgba(80,10,10,0.85)';
    roundRect(bx,by,bw,bh,10);ctx.fill();
    ctx.strokeStyle=hov?'#ff4444':'#aa2222';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='white';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText(lbl,bx+bw/2,by+bh/2+8);
  });

  ctx.fillStyle='#666';ctx.font='14px monospace';ctx.textAlign='center';
  ctx.fillText('Best: '+hiScore,GW/2,GH-30);
  ctx.fillStyle='#444';ctx.font='13px monospace';
  ctx.fillText('← → / A D = Move    Space / ↑ / W = Jump',GW/2,GH-10);
  ctx.textAlign='left';
}

function drawHelp(){
  ctx.fillStyle='#0a0c14';ctx.fillRect(0,0,GW,GH);
  ctx.fillStyle='#0cc8ff';ctx.font='bold 36px monospace';ctx.textAlign='center';ctx.fillText('CONTROLS',GW/2,70);
  const rows=[
    ['Move','← → or A D'],['Jump','Space / ↑ / W'],
    ['Stomp enemy','Jump on head'],['Star','Touch yellow star'],
    ['Finish','Reach orange flag'],['Pause','ESC = Main Menu'],
  ];
  rows.forEach(([a,b],i)=>{
    const y=130+i*58;
    ctx.fillStyle='rgba(20,25,50,0.9)';roundRect(GW/2-270,y-8,540,46,8);ctx.fill();
    ctx.strokeStyle='rgba(50,70,120,0.8)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='white';ctx.font='18px monospace';ctx.textAlign='left';ctx.fillText(a,GW/2-258,y+20);
    ctx.fillStyle='#0cc8ff';ctx.textAlign='right';ctx.fillText(b,GW/2+258,y+20);
  });
  btnRects={};
  const r={x:GW/2-100,y:GH-80,w:200,h:44};btnRects['back']=r;
  const hov=hoverBtn==='back';
  ctx.fillStyle=hov?'rgba(10,80,10,0.9)':'rgba(5,50,5,0.85)';
  roundRect(r.x,r.y,r.w,r.h,10);ctx.fill();
  ctx.strokeStyle=hov?'#44dd44':'#228822';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='white';ctx.font='bold 22px monospace';ctx.textAlign='center';
  ctx.fillText('BACK',GW/2,r.y+r.h/2+8);
  ctx.textAlign='left';
}

function drawOverlay(title,col,extraFn){
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,GW,GH);
  ctx.fillStyle=col;ctx.font='bold 52px monospace';ctx.textAlign='center';ctx.fillText(title,GW/2,GH/2-80);
  ctx.fillStyle='white';ctx.font='bold 26px monospace';ctx.fillText('Score: '+score,GW/2,GH/2-30);
  if(score>=hiScore&&score>0){
    ctx.fillStyle='#ffd700';ctx.font='22px monospace';ctx.fillText('New Best!',GW/2,GH/2+4);
  }
  if(extraFn)extraFn();
  btnRects={};
  [['RETRY','retry'],['MENU','menu']].forEach(([lbl,k],i)=>{
    const r={x:GW/2-110+i*130,y:GH/2+70,w:100,h:42};btnRects[k]=r;
    const hov=hoverBtn===k;
    ctx.fillStyle=hov?'rgba(160,20,20,0.9)':'rgba(80,10,10,0.85)';
    roundRect(r.x,r.y,r.w,r.h,8);ctx.fill();
    ctx.strokeStyle=hov?'#ff4444':'#aa2222';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='white';ctx.font='bold 18px monospace';ctx.textAlign='center';
    ctx.fillText(lbl,r.x+r.w/2,r.y+r.h/2+7);
  });
  ctx.textAlign='left';
}

function drawVictory(){
  ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,GW,GH);
  ctx.fillStyle='#ffd700';ctx.font='bold 48px monospace';ctx.textAlign='center';
  ctx.shadowColor='#ffd700';ctx.shadowBlur=18;ctx.fillText('★ YOU WIN! ★',GW/2,GH/2-80);ctx.shadowBlur=0;
  ctx.fillStyle='white';ctx.font='bold 26px monospace';ctx.fillText('Final Score: '+score,GW/2,GH/2-28);
  ctx.fillStyle='#ffd700';ctx.font='20px monospace';ctx.fillText('Stars: '+starsGot,GW/2,GH/2+6);
  if(score>=hiScore&&score>0){
    ctx.fillStyle='#0cc8ff';ctx.font='20px monospace';ctx.fillText('New Best: '+hiScore,GW/2,GH/2+36);
  }
  btnRects={};
  const r={x:GW/2-100,y:GH/2+80,w:200,h:44};btnRects['menu']=r;
  const hov=hoverBtn==='menu';
  ctx.fillStyle=hov?'rgba(10,80,10,0.9)':'rgba(5,50,5,0.85)';
  roundRect(r.x,r.y,r.w,r.h,10);ctx.fill();
  ctx.strokeStyle=hov?'#44dd44':'#228822';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='white';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillText('MENU',GW/2,r.y+r.h/2+8);
  ctx.textAlign='left';
}

// ── Game loop ─────────────────────────────────────────────────────────────────
let _last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-_last<15.5)return;_last=ts;
  gameT++;

  gctx(()=>{
    if(gameState==='menu'){drawMenu();}
    else if(gameState==='help'){drawHelp();}
    else if(gameState==='play'){updatePlay();drawPlay();}
    else if(gameState==='gameover'){drawPlay();drawOverlay('GAME OVER','#de2424');}
    else if(gameState==='victory'){drawPlay();drawVictory();}
  });
}
requestAnimationFrame(loop);
</script>
</body>
</html>
