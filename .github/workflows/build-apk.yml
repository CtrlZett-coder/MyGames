name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/game-creation-huu9A

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.1'

      - name: Copy HTML game into Android assets
        run: cp space_shooter.html android/app/src/main/assets/game.html

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk SpaceShooter.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-Android
          path: SpaceShooter.apk
          retention-days: 30

      - name: Attach APK to latest release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SpaceShooter.apk
