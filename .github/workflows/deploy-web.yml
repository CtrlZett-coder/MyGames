name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/game-creation-huu9A

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python / pygbag web build ─────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build web version
        run: python -m pygbag --build --width 900 --height 600 space_shooter

      - name: Patch index.html + create service worker
        run: |
          python3 - <<'PYEOF'
          with open("space_shooter/build/web/index.html", "r") as f:
              html = f.read()

          html = html.replace("gui_debug : 2", "gui_debug : 0", 1)
          html = html.replace("background-color:powderblue", "background-color:#000", 1)

          overlay = """
          <style>
          #py-loading {
            position: fixed; inset: 0; background: #111;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 99999; color: #fff; font-family: sans-serif;
            text-align: center; padding: 24px; box-sizing: border-box;
          }
          #py-loading h2 { font-size: 1.6em; margin: 0 0 6px; color: #0af; }
          #py-load-status { font-size: 1em; color: #ccc; margin: 8px 0 4px; min-height: 1.4em; }
          #py-load-detail { font-size: 0.82em; color: #555; margin: 0; }
          #py-load-err    { font-size: 0.82em; color: #f55; margin: 8px 0 0; display:none; }
          .py-spinner {
            width: 56px; height: 56px; border: 5px solid #222;
            border-top-color: #0af; border-radius: 50%;
            animation: py-spin 0.8s linear infinite; margin-bottom: 20px;
          }
          @keyframes py-spin { to { transform: rotate(360deg); } }
          </style>
          <div id="py-loading">
            <div class="py-spinner"></div>
            <h2>Space Shooter</h2>
            <p id="py-load-status">Loading Python runtime...</p>
            <p id="py-load-detail">First load ~1-2 min &mdash; после этого мгновенно (кеш)</p>
            <p id="py-load-err"></p>
          </div>
          <script>
            setInterval(function() {
              var box = document.getElementById('infobox');
              var st  = document.getElementById('py-load-status');
              if (!box || !st) return;
              var t = (box.innerText || '').trim();
              if (t && t !== 'Loading, please wait ...') st.textContent = t;
            }, 300);
            window.addEventListener('error', function(e) {
              var er = document.getElementById('py-load-err');
              if (er) { er.textContent = '⚠ ' + e.message; er.style.display = 'block'; }
              var dt = document.getElementById('py-load-detail');
              if (dt) dt.textContent = 'Обновите страницу / Refresh to retry';
            }, true);
            window.addEventListener('unhandledrejection', function(e) {
              var er = document.getElementById('py-load-err');
              if (er) { er.textContent = '⚠ ' + (e.reason || 'Promise error'); er.style.display = 'block'; }
            });
            var _ck = setInterval(function() {
              var c = document.getElementById('canvas');
              if (c && c.width > 2) {
                document.getElementById('py-loading').style.display = 'none';
                clearInterval(_ck);
              }
            }, 500);
            setTimeout(function() {
              var d = document.getElementById('py-loading');
              if (d) d.style.display = 'none';
            }, 300000);
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.register('./sw.js', {scope: './'})
                .catch(function(e) { console.warn('SW register failed', e); });
            }
          </script>
          """
          html = html.replace("<body>", "<body>" + overlay, 1)

          with open("space_shooter/build/web/index.html", "w") as f:
              f.write(html)

          sw = r"""
          const CACHE = 'space-shooter-v4';
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', e => {
            e.waitUntil(
              caches.keys()
                .then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
                .then(() => clients.claim())
            );
          });
          self.addEventListener('fetch', e => {
            if (e.request.method !== 'GET') return;
            const url = new URL(e.request.url);
            if (!url.protocol.startsWith('http')) return;
            const isCDN = url.hostname === 'pygame-web.github.io';
            if (isCDN) {
              e.respondWith(caches.open(CACHE).then(async cache => {
                const hit = await cache.match(e.request);
                if (hit) return hit;
                const res = await fetch(e.request);
                if (res.ok) cache.put(e.request, res.clone());
                return res;
              }));
            } else {
              e.respondWith(caches.open(CACHE).then(async cache => {
                try {
                  const res = await fetch(e.request);
                  if (res.ok) cache.put(e.request, res.clone());
                  return res;
                } catch (_) {
                  const hit = await cache.match(e.request);
                  return hit || new Response('', {status: 503});
                }
              }));
            }
          });
          """.strip()

          with open("space_shooter/build/web/sw.js", "w") as f:
              f.write(sw)

          # Copy standalone HTML5 games
          import shutil
          shutil.copy("space_shooter.html", "space_shooter/build/web/play.html")
          shutil.copy("red_ball.html",      "space_shooter/build/web/redball.html")

          # Copy favicon / icon files
          import glob
          for f in glob.glob("web-icons/*"):
              shutil.copy(f, "space_shooter/build/web/")

          # Inject favicon tags into pygbag index.html
          with open("space_shooter/build/web/index.html", "r") as f:
              idx = f.read()
          favicon_tags = (
              '<link rel="icon" type="image/x-icon" href="favicon.ico">\n'
              '<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">\n'
              '<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">\n'
              '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">\n'
          )
          idx = idx.replace("<head>", "<head>\n" + favicon_tags, 1)
          with open("space_shooter/build/web/index.html", "w") as f:
              f.write(idx)

          print("All web files patched OK")
          PYEOF

      # ── Android APK build (Python native via buildozer) ──────────────────
      - name: Install buildozer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev \
            libltdl-dev
          pip install --upgrade buildozer cython

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('space_shooter/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build Android APK with buildozer
        working-directory: space_shooter
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tail -100

      - name: Copy APK into web output
        run: |
          APK=$(find space_shooter/bin -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" space_shooter/build/web/SpaceShooter.apk
            echo "APK copied: $APK"
          else
            echo "WARNING: No APK found, buildozer may have failed"
            # Fallback: small placeholder so release step doesn't break
            echo "APK build failed" > space_shooter/build/web/SpaceShooter.apk
          fi

      # ── Download page ─────────────────────────────────────────────────────
      - name: Create download page
        run: |
          cat > space_shooter/build/web/download.html << 'HTML'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Space Shooter — Скачать</title>
          <style>
            *{margin:0;padding:0;box-sizing:border-box}
            body{background:#0a0a1a;color:#fff;font-family:sans-serif;min-height:100vh;
                 display:flex;align-items:center;justify-content:center;padding:20px}
            .card{background:#111;border:1px solid #246;border-radius:16px;
                  padding:32px;max-width:440px;width:100%;text-align:center}
            h1{color:#0af;font-size:2em;margin-bottom:6px}
            p{color:#888;margin-bottom:24px;font-size:0.95em}
            .btn{display:block;padding:16px 24px;border-radius:10px;
                 text-decoration:none;font-size:1.1em;font-weight:bold;
                 margin:12px 0;transition:opacity .2s}
            .btn:hover{opacity:0.85}
            .apk{background:#28a;color:#fff}
            .html{background:#246;color:#0af;border:1px solid #0af}
            .web{background:#204;color:#a4f;border:1px solid #a4f}
            .note{font-size:0.78em;color:#555;margin-top:6px}
          </style>
          </head>
          <body>
          <div class="card">
            <h1>🎮 My Games</h1>
            <p>Выбери игру</p>

            <h2 style="color:#0af;margin:16px 0 8px;font-size:1.1em">🚀 Space Shooter</h2>
            <a class="btn apk" href="SpaceShooter.apk" download>
              📦 APK для Android
            </a>
            <div class="note">Настройки → Безопасность → Разрешить из неизвестных источников</div>
            <a class="btn html" href="play.html">
              🌐 Играть в браузере
            </a>
            <div class="note">HTML5 — iPhone, Android, ПК — мгновенно</div>

            <h2 style="color:#f44;margin:20px 0 8px;font-size:1.1em">🔴 Red Ball</h2>
            <a class="btn html" href="redball.html" style="background:#442222;border-color:#f44;color:#f88">
              🌐 Играть в браузере
            </a>
            <div class="note">Платформер — работает везде</div>
          </div>
          </body>
          </html>
          HTML
          echo "Download page created"

      - name: Show deployed files
        run: find space_shooter/build/web -type f | sort

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./space_shooter/build/web

      # ── GitHub Release with downloadable assets ───────────────────────────
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="MyGames — последняя версия"
          NOTES="## 🎮 Мои игры — скачать

          ### 🚀 Space Shooter
          | Файл | Описание |
          |---|---|
          | \`SpaceShooter.apk\` | Android APK |
          | \`SpaceShooterHTML5.html\` | HTML5 — открой в браузере |

          ### 🔴 Red Ball
          | Файл | Описание |
          |---|---|
          | \`RedBall.html\` | HTML5 — открой в браузере |

          **APK:** Настройки → Безопасность → Разрешить из неизвестных источников
          **HTML5:** Скачай файл → открой в любом браузере (без интернета)"

          cp space_shooter.html SpaceShooterHTML5.html
          cp red_ball.html RedBall.html

          # Delete old release and tag, then recreate
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          sleep 2

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --tag-name "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest \
            space_shooter/build/web/SpaceShooter.apk \
            SpaceShooterHTML5.html \
            RedBall.html
