name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/game-creation-huu9A   # deploy from feature branch for testing

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build web version
        # pygbag puts output in <game_folder>/build/web/
        run: python -m pygbag --build space_shooter

      - name: Show build output (debug)
        run: find space_shooter/build/web -type f | sort

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./space_shooter/build/web   # correct path
