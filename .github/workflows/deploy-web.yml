name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/game-creation-huu9A

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build web version
        run: python -m pygbag --build space_shooter

      - name: Download CDN files for self-hosting
        run: |
          CDN="https://pygame-web.github.io/cdn/0.9.3"
          DEST="space_shooter/build/web"
          echo "Downloading CDN files..."
          curl -sL "$CDN/pythons.js"       -o "$DEST/pythons.js"
          curl -sL "$CDN/browserfs.min.js" -o "$DEST/browserfs.min.js"
          echo "Done. File sizes:"
          ls -lh "$DEST/pythons.js" "$DEST/browserfs.min.js"

      - name: Patch index.html to use local CDN + add loading screen
        run: |
          python3 - <<'EOF'
          import re

          with open("space_shooter/build/web/index.html", "r") as f:
              html = f.read()

          # Replace remote CDN references with local files
          html = html.replace(
              "https://pygame-web.github.io/cdn/0.9.3/pythons.js",
              "./pythons.js"
          )
          html = html.replace(
              "https://pygame-web.github.io/cdn/0.9.3//browserfs.min.js",
              "./browserfs.min.js"
          )
          html = html.replace(
              "https://pygame-web.github.io/cdn/0.9.3/",
              "./browserfs.min.js"  # fallback ref inside browserfs
          )

          # Add a visible loading overlay (shown before JS runs)
          loading_overlay = """
          <style>
          #py-loading {
            position: fixed; inset: 0;
            background: #111;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 99999; color: #fff; font-family: sans-serif;
          }
          #py-loading h2 { font-size: 1.6em; margin: 0 0 12px; }
          #py-loading p  { font-size: 1em; color: #aaa; margin: 4px 0; }
          .spinner {
            width: 48px; height: 48px; border: 5px solid #333;
            border-top-color: #0af; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 20px;
          }
          @keyframes spin { to { transform: rotate(360deg); } }
          </style>
          <div id="py-loading">
            <div class="spinner"></div>
            <h2>Loading Space Shooter...</h2>
            <p>Downloading Python runtime (~20 MB)</p>
            <p>Please wait, this can take 30–60 seconds</p>
          </div>
          <script>
            // Hide overlay once pygame canvas starts drawing
            var _pyLoadCheck = setInterval(function() {
              var c = document.getElementById('canvas');
              if (c && c.width > 1) {
                document.getElementById('py-loading').style.display = 'none';
                clearInterval(_pyLoadCheck);
              }
            }, 500);
            // Remove after 3 min max in case check fails
            setTimeout(function() {
              var d = document.getElementById('py-loading');
              if (d) d.style.display = 'none';
            }, 180000);
          </script>
          """
          html = html.replace("<body>", "<body>" + loading_overlay)

          with open("space_shooter/build/web/index.html", "w") as f:
              f.write(html)

          print("index.html patched successfully")
          EOF

      - name: Show build output
        run: find space_shooter/build/web -type f | sort

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./space_shooter/build/web
